ت قصيرة الأجل"]}, {"id": "ac230", "title": "محاسبة البنوك والمؤسسات المالية", "lessons": ["طبيعة العمل المصرفي والودائع", "التمويل الإسلامي: المرابحة والإجارة", "الاعتمادات المستندية وخطابات الضمان"]}, {"id": "fn240", "title": "الإدارة المالية", "lessons": ["القيمة الزمنية للنقود", "تحليل القوائم المالية بالنسب", "الموازنة الرأسمالية"]}, {"id": "fn245", "title": "النقود والبنوك", "lessons": ["وظائف النقود والبنك المركزي", "أسعار الصرف والعملات الأجنبية", "أسعار الفائدة والقروض"]}, {"id": "ac250", "title": "محاسبة المنشآت النفطية", "lessons": ["طبيعة الصناعة ومراحلها", "الجهود الناجحة مقابل التكلفة الكاملة", "الاستنفاد وحساب الإزالة"]}, {"id": "ac255", "title": "المحاسبة الحكومية", "lessons": ["طبيعة الوحدات الحكومية والموازنة العامة", "أساس الاستحقاق في القطاع العام"]}, {"id": "st260", "title": "الإحصاء للمحاسبين", "lessons": ["الإحصاء الوصفي", "الاحتمالات والعينات في المراجعة", "الانحدار والارتباط"]}, {"id": "au270", "title": "المراجعة", "lessons": ["معايير المراجعة والرقابة الداخلية", "أدلة المراجعة", "تقرير المراجع"]}, {"id": "tx280", "title": "الزكاة والضريبة: دراسة متقدمة", "lessons": ["الوعاء الزكوي", "ضريبة الدخل وضريبة الاستقطاع", "ضريبة القيمة المضافة المتقدمة", "الفوترة الإلكترونية (فاتورة)"]}, {"id": "core", "title": "المسار الأساسي: احتراف المحاسب الشامل", "lessons": ["تأسيس المنشأة والإعدادات", "دليل الحسابات والقيود والسندات", "الأصناف والمخزون والمستودعات", "المشتريات والموردون", "المبيعات والعملاء ونقاط البيع", "الضرائب والتقارير", "الجرد والإقفال والاختبار العملي"]}, {"id": "versions", "title": "التعرف على إصدارات المحاسب الشامل", "lessons": ["خريطة منتجات المحاسب الشامل", "أنواع التراخيص والطرفيات", "كيف تختار الإصدار المناسب"]}, {"id": "acct", "title": "أساسيات المحاسبة لمستخدمي الأنظمة", "lessons": ["المعادلة المحاسبية والقيد المزدوج", "الدورة المحاسبية", "القوائم المالية وقراءتها", "المخزون والذمم بلغة الإدارة"]}, {"id": "ksa", "title": "الأنظمة السعودية للمنشآت", "lessons": ["ضريبة القيمة المضافة", "الفوترة الإلكترونية (فاتورة)", "الزكاة", "أساسيات نظام العمل للمحاسب"]}, {"id": "admin", "title": "الرقابة والإدارة في المنشأة", "lessons": ["الصلاحيات وفصل المهام", "الرقابة على النقد ونقاط البيع", "لوحة المدير: التقارير التي تُراجع دورياً"]}]};window.LESSON_BODIES={"lesson:fa1-0": "\u003cp>المحاسبة نظام لتسجيل العمليات المالية وتصنيفها وتلخيصها وعرضها في قوائم تساعد المستخدمين على اتخاذ القرار.\u003c/p>\n  \u003ch3>مستخدمو المعلومات المحاسبية\u003c/h3>\u003cul>\u003cli>\u003cb>داخليون:\u003c/b> الإدارة والملاك.\u003c/li>\u003cli>\u003cb>خارجيون:\u003c/b> البنوك والمستثمرون والموردون وهيئة الزكاة والضريبة والجمارك.\u003c/li>\u003c/ul>\n  \u003ch3>الفروض والمبادئ الأساسية\u003c/h3>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>المبدأ\u003c/th>\u003cth>المعنى\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>الوحدة المحاسبية\u003c/td>\u003ctd>المنشأة مستقلة عن ملاكها، فمصروفات المالك الشخصية لا تُسجل كمصروف للمنشأة.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الاستمرارية\u003c/td>\u003ctd>نفترض أن المنشأة مستمرة في نشاطها في المستقبل المنظور.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الاستحقاق\u003c/td>\u003ctd>الإيراد يُثبت عند اكتسابه والمصروف عند تحمله، بغض النظر عن القبض أو الدفع.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>التكلفة التاريخية\u003c/td>\u003ctd>تُسجل الأصول بتكلفة اقتنائها.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>المقابلة\u003c/td>\u003ctd>تُقابل مصروفات الفترة بإيراداتها لتحديد الربح.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الفترة المحاسبية\u003c/td>\u003ctd>تقسيم حياة المنشأة إلى فترات (غالباً سنة) لإعداد القوائم.\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>", "lesson:fa1-1": "\u003cp>\u003cb>الأصول = الخصوم + حقوق الملكية\u003c/b>\u003c/p>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>العملية\u003c/th>\u003cth>الأصول\u003c/th>\u003cth>الخصوم\u003c/th>\u003cth>حقوق الملكية\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>إيداع رأس مال 100,000 في البنك\u003c/td>\u003ctd>+100,000\u003c/td>\u003ctd>\u003c/td>\u003ctd>+100,000\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>شراء بضاعة آجلة 30,000\u003c/td>\u003ctd>+30,000\u003c/td>\u003ctd>+30,000\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>سداد 10,000 للمورد من البنك\u003c/td>\u003ctd>−10,000\u003c/td>\u003ctd>−10,000\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>إيراد خدمات نقداً 8,000\u003c/td>\u003ctd>+8,000\u003c/td>\u003ctd>\u003c/td>\u003ctd>+8,000\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>دفع إيجار 3,000 نقداً\u003c/td>\u003ctd>−3,000\u003c/td>\u003ctd>\u003c/td>\u003ctd>−3,000\u003c/td>\u003c/tr>\n  \u003ctr>\u003cth>الرصيد\u003c/th>\u003cth>125,000\u003c/th>\u003cth>20,000\u003c/th>\u003cth>105,000\u003c/th>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\u003cp>تحقق: 125,000 = 20,000 + 105,000.\u003c/p>", "lesson:fa1-2": "\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>الحساب\u003c/th>\u003cth>يزيد\u003c/th>\u003cth>ينقص\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>الأصول والمصروفات والمسحوبات\u003c/td>\u003ctd>مدين\u003c/td>\u003ctd>دائن\u003c/td>\u003c/tr>\u003ctr>\u003ctd>الخصوم وحقوق الملكية والإيرادات\u003c/td>\u003ctd>دائن\u003c/td>\u003ctd>مدين\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>كل قيد له طرف مدين وطرف دائن متساويان. يُكتب الطرف المدين أولاً ثم الدائن.\u003c/p>\n  \u003cdiv class=\"tip\">\u003cb>مثال:\u003c/b> بيع بضاعة آجلة بـ12,000 ريال: من حـ/ العملاء 12,000 إلى حـ/ المبيعات 12,000.\u003c/div>", "lesson:fa1-3": "\u003cp>\u003cb>اليومية\u003c/b> دفتر القيد الأول تُسجل فيه العمليات بترتيبها الزمني. \u003cb>الأستاذ\u003c/b> يجمع حركات كل حساب في صفحة مستقلة لمعرفة رصيده.\u003c/p>\n  \u003ch3>خطوات الترحيل\u003c/h3>\u003col>\u003cli>نقل الطرف المدين من القيد إلى الجانب المدين في حساب الأستاذ.\u003c/li>\u003cli>نقل الطرف الدائن إلى الجانب الدائن في الحساب المقابل.\u003c/li>\u003cli>ترصيد الحساب: الفرق بين مجموع المدين ومجموع الدائن.\u003c/li>\u003c/ol>\n  \u003cdiv class=\"tip\">\u003cb>مثال ترصيد الصندوق:\u003c/b> مدين 50,000 و8,000، دائن 3,000 و6,000. الرصيد = 58,000 − 9,000 = 49,000 مدين.\u003c/div>", "lesson:fa1-4": "\u003cp>ميزان المراجعة قائمة بأرصدة جميع الحسابات، ويجب أن يتساوى مجموع الأرصدة المدينة مع مجموع الأرصدة الدائنة.\u003c/p>\n  \u003ch3>أخطاء لا يكشفها الميزان\u003c/h3>\u003cul>\u003cli>إسقاط قيد كامل.\u003c/li>\u003cli>تسجيل القيد مرتين.\u003c/li>\u003cli>الخطأ في الحساب مع صحة الجانب (مثلاً على حساب الإيجار بدل الرواتب).\u003c/li>\u003cli>الأخطاء المتكافئة.\u003c/li>\u003cli>الخطأ في المبدأ (تسجيل شراء أصل كمصروف).\u003c/li>\u003c/ul>\n  \u003ch3>أخطاء يكشفها\u003c/h3>\u003cul>\u003cli>ترحيل طرف واحد فقط.\u003c/li>\u003cli>الترحيل للجانب الخطأ.\u003c/li>\u003cli>خطأ في جمع أو ترصيد حساب.\u003c/li>\u003c/ul>", "lesson:fa1-5": "\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>التسوية\u003c/th>\u003cth>القيد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>مصروف مستحق لم يُدفع\u003c/td>\u003ctd>من حـ/ المصروف إلى حـ/ مصروفات مستحقة\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>مصروف مدفوع مقدماً (الجزء غير المستنفد)\u003c/td>\u003ctd>من حـ/ المصروف المقدم إلى حـ/ المصروف\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>إيراد مستحق لم يُقبض\u003c/td>\u003ctd>من حـ/ إيرادات مستحقة إلى حـ/ الإيراد\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الإهلاك\u003c/td>\u003ctd>من حـ/ مصروف الإهلاك إلى حـ/ مجمع الإهلاك\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الديون المشكوك فيها\u003c/td>\u003ctd>من حـ/ مصروف ديون مشكوك فيها إلى حـ/ مخصص الديون المشكوك فيها\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"tip\">\u003cb>مثال إهلاك بالقسط الثابت:\u003c/b> معدات تكلفتها 60,000 وقيمتها التخريدية 0 وعمرها 5 سنوات: الإهلاك السنوي 12,000.\u003c/div>", "lesson:fa1-6": "\u003cp>بعد التسويات يُعد ميزان المراجعة المعدل، ومنه:\u003c/p>\u003cul>\u003cli>\u003cb>قائمة الدخل:\u003c/b> الإيرادات − المصروفات = صافي الربح أو الخسارة.\u003c/li>\u003cli>\u003cb>قائمة التغيرات في حقوق الملكية:\u003c/b> رأس المال + الربح − المسحوبات.\u003c/li>\u003cli>\u003cb>قائمة المركز المالي:\u003c/b> الأصول والخصوم وحقوق الملكية.\u003c/li>\u003cli>\u003cb>قائمة التدفقات النقدية:\u003c/b> تشغيلية واستثمارية وتمويلية.\u003c/li>\u003c/ul>\n  \u003ch3>قيود الإقفال\u003c/h3>\u003col>\u003cli>إقفال الإيرادات في ملخص الدخل.\u003c/li>\u003cli>إقفال المصروفات في ملخص الدخل.\u003c/li>\u003cli>إقفال ملخص الدخل (الربح) في رأس المال أو الأرباح المبقاة.\u003c/li>\u003cli>إقفال المسحوبات في رأس المال.\u003c/li>\u003c/ol>", "lesson:fa2-0": "\u003cp>\u003cb>الجرد المستمر:\u003c/b> تُحدّث أرصدة المخزون مع كل عملية بيع وشراء، وهو ما تعمل به الأنظمة المحاسبية. \u003cb>الجرد الدوري:\u003c/b> يُحدد المخزون بالعد في نهاية الفترة.\u003c/p>\n  \u003cp>\u003cb>تكلفة المبيعات (دوري)\u003c/b> = مخزون أول المدة + المشتريات الصافية − مخزون آخر المدة.\u003c/p>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>البيان\u003c/th>\u003cth>الكمية\u003c/th>\u003cth>السعر\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>رصيد أول\u003c/td>\u003ctd>100\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>شراء\u003c/td>\u003ctd>100\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>بيع\u003c/td>\u003ctd>150\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003cul>\u003cli>\u003cb>الوارد أولاً صادر أولاً:\u003c/b> 100×10 + 50×12 = 1,600.\u003c/li>\u003cli>\u003cb>المتوسط المرجح:\u003c/b> (1,000 + 1,200) ÷ 200 = 11 × 150 = 1,650.\u003c/li>\u003c/ul>\n  \u003cdiv class=\"note\">\u003cb>ملاحظة:\u003c/b> معايير IFRS المطبقة في السعودية لا تسمح بطريقة الوارد أخيراً صادر أولاً.\u003c/div>", "lesson:fa2-1": "\u003cp>رصيد البنك في دفاتر المنشأة نادراً ما يساوي رصيد كشف البنك بسبب فروق التوقيت والأخطاء.\u003c/p>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>تعديلات على رصيد كشف البنك\u003c/th>\u003cth>تعديلات على رصيد الدفاتر\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>+ إيداعات في الطريق\u003c/td>\u003ctd>+ تحصيلات أضافها البنك\u003c/td>\u003c/tr>\u003ctr>\u003ctd>− شيكات صادرة لم تُصرف\u003c/td>\u003ctd>− عمولات ومصاريف بنكية\u003c/td>\u003c/tr>\u003ctr>\u003ctd>± أخطاء البنك\u003c/td>\u003ctd>− شيكات مرتدة · ± أخطاء الدفاتر\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>بعد التسوية يجب أن يتساوى الرصيدان المعدلان، وتُسجل قيود فقط لتعديلات جانب الدفاتر.\u003c/p>", "lesson:fa2-2": "\u003cp>يُقدَّر الجزء غير القابل للتحصيل من أرصدة العملاء ويُكوَّن له مخصص، فتظهر الذمم بصافي القيمة المتوقع تحصيلها.\u003c/p>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>العمر\u003c/th>\u003cth class=\"num\">الرصيد\u003c/th>\u003cth class=\"num\">نسبة التعثر\u003c/th>\u003cth class=\"num\">المخصص\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>0 - 30 يوماً\u003c/td>\u003ctd class=\"num\">80,000\u003c/td>\u003ctd class=\"num\">1%\u003c/td>\u003ctd class=\"num\">800\u003c/td>\u003c/tr>\u003ctr>\u003ctd>31 - 90 يوماً\u003c/td>\u003ctd class=\"num\">30,000\u003c/td>\u003ctd class=\"num\">5%\u003c/td>\u003ctd class=\"num\">1,500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>أكثر من 90 يوماً\u003c/td>\u003ctd class=\"num\">10,000\u003c/td>\u003ctd class=\"num\">30%\u003c/td>\u003ctd class=\"num\">3,000\u003c/td>\u003c/tr>\u003ctr>\u003cth>الإجمالي\u003c/th>\u003cth class=\"num\">120,000\u003c/th>\u003cth>\u003c/th>\u003cth class=\"num\">5,300\u003c/th>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>إذا كان رصيد المخصص الحالي 2,000 دائن، يُسجل مصروف بالفرق 3,300.\u003c/p>", "lesson:fa2-3": "\u003cp>\u003cb>تكلفة الأصل\u003c/b> = سعر الشراء + كل ما يلزم لتجهيزه للاستخدام (نقل، تركيب، رسوم).\u003c/p>\n  \u003cul>\u003cli>\u003cb>القسط الثابت:\u003c/b> (التكلفة − الخردة) ÷ العمر.\u003c/li>\u003cli>\u003cb>القسط المتناقص:\u003c/b> نسبة ثابتة على القيمة الدفترية المتبقية.\u003c/li>\u003cli>\u003cb>وحدات الإنتاج:\u003c/b> حسب الاستخدام الفعلي.\u003c/li>\u003c/ul>\n  \u003cdiv class=\"tip\">\u003cb>مثال:\u003c/b> سيارة 90,000 + تجهيز 10,000، خردة 20,000، عمر 4 سنوات: الإهلاك السنوي = (100,000 − 20,000) ÷ 4 = 20,000.\u003c/div>", "lesson:ac201-0": "\u003cp>تطبق المنشآت المدرجة والكبيرة في المملكة المعايير الدولية للتقرير المالي (IFRS) كما اعتمدتها الهيئة السعودية للمراجعين والمحاسبين، وتطبق المنشآت الصغيرة والمتوسطة معيار IFRS للمنشآت الصغيرة والمتوسطة.\u003c/p>\n  \u003cp>\u003cb>الخصائص النوعية الأساسية:\u003c/b> الملاءمة (تؤثر في القرار) والتمثيل الصادق (كاملة ومحايدة وخالية من الخطأ). \u003cb>الخصائص المعززة:\u003c/b> القابلية للمقارنة، القابلية للتحقق، التوقيت المناسب، القابلية للفهم.\u003c/p>\n  \u003cp>\u003cb>عناصر القوائم المالية:\u003c/b> الأصل مورد اقتصادي حالي تسيطر عليه المنشأة نتيجة أحداث سابقة. الالتزام واجب حالي بتحويل مورد اقتصادي. حقوق الملكية هي الحصة المتبقية بعد طرح الالتزامات.\u003c/p>", "lesson:ac201-1": "\u003cp>يُعترف بالإيراد عندما تنقل المنشأة السيطرة على السلعة أو الخدمة للعميل، وفق خمس خطوات:\u003c/p>\n  \u003col>\u003cli>تحديد العقد مع العميل.\u003c/li>\u003cli>تحديد التزامات الأداء.\u003c/li>\u003cli>تحديد سعر المعاملة.\u003c/li>\u003cli>توزيع السعر على التزامات الأداء.\u003c/li>\u003cli>الاعتراف بالإيراد عند (أو كلما) تم الوفاء بالالتزام.\u003c/li>\u003c/ol>\n  \u003cp>\u003cb>مثال:\u003c/b> بيع جهاز مع صيانة سنة بسعر إجمالي 12,000. السعر المستقل للجهاز 10,000 وللصيانة 2,000، فيُعترف بإيراد الجهاز عند التسليم، وإيراد الصيانة على مدار السنة (166.67 شهرياً).\u003c/p>\n  \u003cp>المبلغ المحصل مقدماً عن خدمة لم تُقدَّم بعد يُسجل \u003cb>إيرادات مقدمة\u003c/b> (التزام).\u003c/p>", "lesson:ac201-2": "\u003cp>يُقاس المخزون بـ\u003cb>التكلفة أو صافي القيمة القابلة للتحقق أيهما أقل\u003c/b>. التكلفة تشمل الشراء والتحويل وأي تكاليف لازمة لإيصاله لموقعه وحالته. صافي القيمة القابلة للتحقق = سعر البيع المتوقع − تكاليف الإتمام والبيع.\u003c/p>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>الصنف\u003c/th>\u003cth class=\"num\">التكلفة\u003c/th>\u003cth class=\"num\">صافي القيمة\u003c/th>\u003cth class=\"num\">القياس\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>أ\u003c/td>\u003ctd class=\"num\">5,000\u003c/td>\u003ctd class=\"num\">6,500\u003c/td>\u003ctd class=\"num\">5,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ب\u003c/td>\u003ctd class=\"num\">8,000\u003c/td>\u003ctd class=\"num\">7,200\u003c/td>\u003ctd class=\"num\">7,200\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>التخفيض 800 في الصنف (ب) يُحمّل على تكلفة المبيعات في الفترة نفسها.\u003c/p>", "lesson:ac201-3": "\u003cp>تُثبت الأصول الثابتة بالتكلفة ثم تُقاس بنموذج التكلفة (التكلفة − مجمع الإهلاك − الانخفاض) أو نموذج إعادة التقييم.\u003c/p>\n  \u003cp>\u003cb>عند بيع أصل:\u003c/b> يُستبعد الأصل ومجمع إهلاكه، ويُثبت النقد المحصل، والفرق ربح أو خسارة.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> معدات تكلفتها 50,000 ومجمع إهلاكها 35,000 بيعت بـ 18,000 نقداً، فالقيمة الدفترية 15,000 والربح 3,000.\u003c/p>", "lesson:ac210-0": "\u003cp>تتكون تكلفة المنتج من: \u003cb>المواد المباشرة\u003c/b> + \u003cb>الأجور المباشرة\u003c/b> + \u003cb>التكاليف الصناعية غير المباشرة\u003c/b>. مجموع المواد والأجور المباشرة يسمى \u003cb>التكلفة الأولية\u003c/b>، ومجموع الأجور والتكاليف غير المباشرة يسمى \u003cb>تكلفة التحويل\u003c/b>.\u003c/p>\n  \u003cp>من حيث السلوك: \u003cb>متغيرة\u003c/b> تتغير مع حجم الإنتاج، و\u003cb>ثابتة\u003c/b> لا تتغير في المدى الملائم، و\u003cb>مختلطة\u003c/b>.\u003c/p>", "lesson:ac210-1": "\u003cp>يناسب الإنتاج حسب الطلب (أثاث، مطابع، مقاولات). تُجمع التكاليف لكل أمر في بطاقة تكلفة.\u003c/p>\n  \u003cp>\u003cb>معدل التحميل المقدر\u003c/b> = التكاليف غير المباشرة المقدرة ÷ أساس التحميل المقدر (ساعات عمل أو ساعات آلة).\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> تكاليف غير مباشرة مقدرة 200,000 وساعات عمل مقدرة 10,000، فالمعدل 20 ريالاً للساعة. أمر استغرق 150 ساعة يُحمَّل 3,000.\u003c/p>", "lesson:ac210-2": "\u003cp>يناسب الإنتاج المستمر المتجانس (أغذية، بلاستيك، أسمنت). تُجمع التكاليف لكل مرحلة وتُقسم على \u003cb>الوحدات المعادلة\u003c/b>.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> أُكملت 8,000 وحدة، وبقيت 2,000 وحدة مكتملة 50% من تكاليف التحويل، فالوحدات المعادلة للتحويل = 8,000 + 1,000 = 9,000.\u003c/p>", "lesson:ac210-3": "\u003cp>\u003cb>انحراف سعر المواد\u003c/b> = (السعر الفعلي − السعر المعياري) × الكمية الفعلية.\u003cbr>\u003cb>انحراف كمية المواد\u003c/b> = (الكمية الفعلية − الكمية المعيارية) × السعر المعياري.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> المعيار 2 كجم × 10 ريال للوحدة. أنتجنا 1,000 وحدة واستخدمنا 2,100 كجم بسعر 9.5. انحراف السعر = (9.5 − 10) × 2,100 = 1,050 ملائم. انحراف الكمية = (2,100 − 2,000) × 10 = 1,000 غير ملائم.\u003c/p>", "lesson:ac220-0": "\u003cp>\u003cb>هامش المساهمة للوحدة\u003c/b> = سعر البيع − التكلفة المتغيرة. \u003cb>نقطة التعادل بالوحدات\u003c/b> = التكاليف الثابتة ÷ هامش المساهمة للوحدة.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> سعر 50، تكلفة متغيرة 30، ثابتة 40,000، فالتعادل 2,000 وحدة. إذا كانت المبيعات المتوقعة 2,500 وحدة فهامش الأمان 500 وحدة (20%).\u003c/p>", "lesson:ac220-1": "\u003cp>تبدأ الموازنة الشاملة بـ\u003cb>موازنة المبيعات\u003c/b>، ثم الإنتاج أو المشتريات، ثم المصروفات، ثم \u003cb>الموازنة النقدية\u003c/b>، وتنتهي بالقوائم التقديرية.\u003c/p>\n  \u003cp>\u003cb>الموازنة النقدية:\u003c/b> الرصيد الافتتاحي + المتحصلات − المدفوعات = الرصيد الختامي، ويُحدد منها العجز الذي يحتاج تمويلاً أو الفائض الذي يمكن استثماره.\u003c/p>", "lesson:ac220-2": "\u003cp>التكلفة \u003cb>الملائمة\u003c/b> هي التكلفة المستقبلية التي تختلف بين البدائل. التكاليف الغارقة (المنفقة سابقاً) غير ملائمة.\u003c/p>\n  \u003cp>\u003cb>قرار الصنع أو الشراء:\u003c/b> قارن التكلفة المتغيرة للصنع والتكاليف الثابتة التي يمكن تجنبها مع سعر الشراء.\u003c/p>\n  \u003cp>\u003cb>قبول طلبية خاصة:\u003c/b> تُقبل إذا كان سعرها يغطي التكلفة المتغيرة والتكاليف الإضافية، وكانت هناك طاقة عاطلة.\u003c/p>", "lesson:ac230-0": "\u003cp>من منظور البنك، \u003cb>وديعة العميل التزام\u003c/b> على البنك، والنقد المستلم أصل. لذلك عند إيداع عميل 10,000 يُجعل النقد مديناً وودائع العملاء دائنة.\u003c/p>\n  \u003cp>أنواع الودائع: جارية (تحت الطلب)، ادخارية، استثمارية لأجل. والبنوك في المملكة تخضع لإشراف البنك المركزي السعودي (ساما).\u003c/p>", "lesson:ac230-1": "\u003cp>\u003cb>المرابحة:\u003c/b> يشتري البنك السلعة ثم يبيعها للعميل بالتكلفة مضافاً إليها ربح معلوم يُسدد على أقساط. يُوزع الربح على فترة التمويل.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> سيارة تكلفتها 100,000 بيعت مرابحة بـ 115,000 على 3 سنوات، فالربح 15,000 يُعترف به على مدى الفترة.\u003c/p>\n  \u003cp>\u003cb>الإجارة المنتهية بالتمليك:\u003c/b> يؤجر البنك الأصل للعميل وتنتقل الملكية في نهاية العقد.\u003c/p>\n  \u003cp>في دفاتر المنشأة المستفيدة يُسجل التمويل التزاماً، وتكلفة التمويل مصروفاً على مدى الفترة.\u003c/p>", "lesson:ac230-2": "\u003cp>\u003cb>الاعتماد المستندي:\u003c/b> تعهد من بنك المستورد بالدفع للمصدر عند تقديم مستندات مطابقة. المبالغ المدفوعة على الاعتماد تُجمع في حساب «اعتمادات مستندية» حتى وصول البضاعة ثم تُحمل على تكلفة المخزون.\u003c/p>\n  \u003cp>\u003cb>خطاب الضمان:\u003c/b> تعهد من البنك بالدفع للمستفيد إذا أخل العميل بالتزامه (ابتدائي، نهائي، دفعة مقدمة). لا يُسجل إلا الغطاء النقدي والعمولة، ويُفصح عنه كالتزام محتمل.\u003c/p>", "lesson:fn240-0": "\u003cp>\u003cb>القيمة المستقبلية\u003c/b> = المبلغ × (1 + ع)\u003csup>ن\u003c/sup>. \u003cb>القيمة الحالية\u003c/b> = المبلغ ÷ (1 + ع)\u003csup>ن\u003c/sup>.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> 10,000 بمعدل 10% لسنتين قيمتها المستقبلية 12,100. ومبلغ 12,100 يُستلم بعد سنتين قيمته الحالية 10,000.\u003c/p>", "lesson:fn240-1": "\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>النسبة\u003c/th>\u003cth>المعادلة\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>التداول\u003c/td>\u003ctd>الأصول المتداولة ÷ الخصوم المتداولة\u003c/td>\u003c/tr>\u003ctr>\u003ctd>السيولة السريعة\u003c/td>\u003ctd>(المتداولة − المخزون) ÷ الخصوم المتداولة\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>هامش الربح الصافي\u003c/td>\u003ctd>صافي الربح ÷ المبيعات\u003c/td>\u003c/tr>\u003ctr>\u003ctd>العائد على الأصول\u003c/td>\u003ctd>صافي الربح ÷ إجمالي الأصول\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>دوران المخزون\u003c/td>\u003ctd>تكلفة المبيعات ÷ متوسط المخزون\u003c/td>\u003c/tr>\u003ctr>\u003ctd>متوسط فترة التحصيل\u003c/td>\u003ctd>(الذمم المدينة ÷ المبيعات الآجلة) × 365\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "lesson:fn240-2": "\u003cp>\u003cb>فترة الاسترداد\u003c/b>: المدة اللازمة لاسترداد الاستثمار من التدفقات. \u003cb>صافي القيمة الحالية\u003c/b> = القيمة الحالية للتدفقات − الاستثمار المبدئي، ويُقبل المشروع إذا كانت موجبة.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> استثمار 100,000 يدر 30,000 سنوياً، فترة استرداده 3.33 سنوات.\u003c/p>", "lesson:fn245-0": "\u003cp>للنقود أربع وظائف: وسيط للتبادل، مقياس للقيمة، مخزن للقيمة، ومعيار للمدفوعات الآجلة.\u003c/p>\n  \u003cp>يتولى \u003cb>البنك المركزي السعودي (ساما)\u003c/b> إصدار العملة والإشراف على البنوك والمحافظة على الاستقرار النقدي. ومن أدواته: معدل الاحتياطي النظامي، وأسعار اتفاقيات إعادة الشراء، وعمليات السوق المفتوحة.\u003c/p>", "lesson:fn245-1": "\u003cp>الريال السعودي مربوط بالدولار الأمريكي بسعر 3.75. تُسجل معاملات العملة الأجنبية بسعر يوم المعاملة، وعند السداد بسعر مختلف ينتج \u003cb>فرق عملة\u003c/b> ربحاً أو خسارة.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> شراء بضاعة بـ 1,000 يورو بسعر 4.0 (4,000 ريال)، وسُددت بسعر 4.1 (4,100 ريال)، فخسارة فرق العملة 100.\u003c/p>", "lesson:fn245-2": "\u003cp>عند الحصول على قرض يُسجل النقد مديناً والقرض دائناً. وتُسجل الفائدة مصروفاً في الفترة التي تخصها، ولو لم تُدفع بعد.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> قرض 200,000 بفائدة سنوية 6%، فمصروف الفائدة الشهري 1,000.\u003c/p>", "lesson:ac250-0": "\u003cp>تمر الصناعة بمراحل: \u003cb>الحصول على الامتياز\u003c/b>، \u003cb>الاستكشاف\u003c/b> (مسح جيولوجي وحفر استكشافي)، \u003cb>التطوير\u003c/b> (حفر آبار الإنتاج وإنشاء المرافق)، \u003cb>الإنتاج\u003c/b>، ثم \u003cb>الإزالة والتأهيل\u003c/b>.\u003c/p>\n  \u003cp>تنقسم الصناعة إلى أنشطة المنبع (استكشاف وإنتاج)، والوسط (نقل وتخزين)، والمصب (تكرير وتوزيع ومحطات وقود).\u003c/p>", "lesson:ac250-1": "\u003cp>\u003cb>الجهود الناجحة:\u003c/b> تُرسمل تكاليف الآبار الناجحة فقط، وتُحمَّل تكاليف الآبار الجافة مصروفاً فوراً.\u003c/p>\n  \u003cp>\u003cb>التكلفة الكاملة:\u003c/b> تُرسمل كل تكاليف الاستكشاف ناجحة أو جافة ضمن مجمع التكلفة.\u003c/p>\n  \u003cp>يتناول المعيار الدولي IFRS 6 تكاليف الاستكشاف والتقييم.\u003c/p>", "lesson:ac250-2": "\u003cp>\u003cb>معدل الاستنفاد\u003c/b> = (التكلفة المرسملة − القيمة المتبقية) ÷ الاحتياطي المؤكد. \u003cb>استنفاد الفترة\u003c/b> = المعدل × الإنتاج الفعلي.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> تكلفة مرسملة 40 مليوناً، احتياطي 2 مليون برميل، فالمعدل 20 للبرميل. إنتاج السنة 150,000 برميل يعني استنفاداً قدره 3 ملايين.\u003c/p>\n  \u003cp>يُعترف أيضاً بمخصص لتكاليف إزالة الأصول وتأهيل الموقع بقيمته الحالية.\u003c/p>", "lesson:ac255-0": "\u003cp>هدف الوحدة الحكومية تقديم الخدمة لا الربح، وتُدار بالموازنة العامة المعتمدة. وتمر النفقة بمراحل: الارتباط، ثم التحقق (الاستحقاق)، ثم أمر الصرف، ثم الصرف الفعلي.\u003c/p>\n  \u003cp>تُصنف المصروفات في أبواب، مثل التعويضات والسلع والخدمات والأصول غير المالية.\u003c/p>", "lesson:ac255-1": "\u003cp>تتحول الجهات الحكومية في المملكة من الأساس النقدي إلى \u003cb>أساس الاستحقاق\u003c/b> وفق معايير المحاسبة الدولية للقطاع العام (IPSAS)، بإشراف وزارة المالية.\u003c/p>\n  \u003cp>في الأساس النقدي تُسجل العمليات عند القبض أو الدفع. وفي أساس الاستحقاق تُسجل عند حدوثها، فتظهر الأصول الثابتة والالتزامات والإهلاك في القوائم.\u003c/p>", "lesson:st260-0": "\u003cp>\u003cb>المتوسط\u003c/b> = مجموع القيم ÷ عددها. \u003cb>الوسيط\u003c/b> هو القيمة الوسطى بعد الترتيب. \u003cb>المنوال\u003c/b> هو الأكثر تكراراً. \u003cb>الانحراف المعياري\u003c/b> يقيس تشتت القيم حول المتوسط.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> مبيعات خمسة أيام: 10، 12، 12، 15، 21 (بالآلاف). المتوسط 14، والوسيط 12، والمنوال 12.\u003c/p>", "lesson:st260-1": "\u003cp>\u003cb>الاحتمال\u003c/b> = عدد الحالات المواتية ÷ عدد الحالات الممكنة.\u003c/p>\n  \u003cp>في المراجعة تُستخدم \u003cb>العينات الإحصائية\u003c/b> (عشوائية بسيطة، منتظمة، طبقية، بوحدة النقد) لاختيار مفردات تمثل المجتمع، فيمكن تعميم النتيجة بدرجة ثقة محددة.\u003c/p>\n  \u003cp>\u003cb>العينة الطبقية:\u003c/b> تقسيم المجتمع إلى طبقات (مثلاً فواتير أكبر من 50,000 وأقل) والاختيار من كل طبقة.\u003c/p>", "lesson:st260-2": "\u003cp>\u003cb>معامل الارتباط\u003c/b> بين −1 و+1 يقيس قوة واتجاه العلاقة. قيمة قريبة من +1 تعني علاقة طردية قوية.\u003c/p>\n  \u003cp>\u003cb>الانحدار البسيط\u003c/b> ص = أ + ب س، ويستخدم في المحاسبة لتقدير التكاليف المختلطة: أ هي التكلفة الثابتة، وب التكلفة المتغيرة للوحدة.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> تكلفة الصيانة = 5,000 + 2 × ساعات التشغيل. عند 1,000 ساعة تكون التكلفة المتوقعة 7,000.\u003c/p>", "lesson:au270-0": "\u003cp>تطبق المملكة معايير المراجعة الدولية (ISA) كما اعتمدتها الهيئة السعودية للمراجعين والمحاسبين.\u003c/p>\n  \u003cp>مكونات الرقابة الداخلية (إطار COSO): بيئة الرقابة، تقييم المخاطر، أنشطة الرقابة، المعلومات والاتصال، والمتابعة.\u003c/p>\n  \u003cp>من أنشطة الرقابة: الفصل بين المهام، والتفويض والاعتماد، والتسويات الدورية، والرقابة على الوصول للأنظمة.\u003c/p>", "lesson:au270-1": "\u003cp>يجب أن تكون الأدلة \u003cb>كافية\u003c/b> (كمية) و\u003cb>مناسبة\u003c/b> (جودة: ملاءمة وموثوقية).\u003c/p>\n  \u003cp>الأدلة الخارجية أقوى من الداخلية، والمستندية أقوى من الشفهية، وما يحصل عليه المراجع مباشرة (مثل المصادقات والملاحظة) أقوى من غيره.\u003c/p>\n  \u003cp>من الإجراءات: الفحص، الملاحظة، المصادقات الخارجية، إعادة الاحتساب، الإجراءات التحليلية، والاستفسار.\u003c/p>", "lesson:au270-2": "\u003cul>\u003cli>\u003cb>رأي غير معدل (نظيف):\u003c/b> القوائم معروضة بعدل من جميع الجوانب الجوهرية.\u003c/li>\u003cli>\u003cb>رأي متحفظ:\u003c/b> تحريف جوهري غير منتشر، أو عدم كفاية أدلة غير منتشر.\u003c/li>\u003cli>\u003cb>رأي معارض:\u003c/b> تحريف جوهري ومنتشر.\u003c/li>\u003cli>\u003cb>امتناع عن إبداء الرأي:\u003c/b> عدم القدرة على الحصول على أدلة كافية، وأثره المحتمل جوهري ومنتشر.\u003c/li>\u003c/ul>", "lesson:tx280-0": "\u003cp>تُفرض الزكاة على المنشآت المملوكة لسعوديين وخليجيين بنسبة 2.5% من الوعاء الزكوي (2.5775% عند السنة الشمسية).\u003c/p>\n  \u003cp>بشكل مبسط: \u003cb>الوعاء\u003c/b> = عناصر الإضافة (رأس المال، الاحتياطيات، الأرباح المبقاة، المخصصات، القروض طويلة الأجل الممولة للأصول غير الزكوية...) − عناصر الحسم (صافي الأصول الثابتة، الاستثمارات في منشآت محلية خاضعة...)، وبما لا يقل عن صافي الربح المعدل.\u003c/p>\n  \u003cp>اللائحة التنفيذية لجباية الزكاة فيها تفاصيل وحدود يجب الرجوع إليها.\u003c/p>", "lesson:tx280-1": "\u003cp>\u003cb>ضريبة الدخل\u003c/b> 20% على حصة غير السعودي (وغير الخليجي) في المنشأة من الربح الخاضع، ونسب خاصة لقطاع النفط والغاز.\u003c/p>\n  \u003cp>\u003cb>ضريبة الاستقطاع\u003c/b> تخصمها المنشأة المقيمة عند الدفع لجهة غير مقيمة عن خدمات أو إيجارات أو أرباح أو إتاوات، بنسب تتراوح بين 5% و20% بحسب نوع الدفعة، وتوردها للهيئة خلال المدة النظامية.\u003c/p>\n  \u003cp>\u003cb>مثال:\u003c/b> أتعاب خدمات فنية 100,000 لجهة غير مقيمة بنسبة 5%: يُدفع للجهة 95,000 ويُورد للهيئة 5,000.\u003c/p>", "lesson:tx280-2": "\u003cp>النسبة الأساسية 15%. \u003cb>صافي الضريبة المستحقة\u003c/b> = ضريبة المخرجات − ضريبة المدخلات القابلة للخصم.\u003c/p>\n  \u003cp>\u003cb>نسبة الصفر:\u003c/b> مثل الصادرات وبعض الخدمات الدولية والأدوية والمعدات الطبية المؤهلة (يحق خصم المدخلات). \u003cb>الإعفاء:\u003c/b> مثل بعض الخدمات المالية وتأجير المساكن (لا يحق خصم المدخلات المرتبطة).\u003c/p>\n  \u003cp>التسجيل إلزامي إذا تجاوزت التوريدات الخاضعة 375,000 ريال سنوياً، واختياري من 187,500.\u003c/p>", "lesson:tx280-3": "\u003cp>\u003cb>المرحلة الأولى (الإصدار والحفظ):\u003c/b> بدأت 4 ديسمبر 2021، وتلزم بإصدار الفواتير إلكترونياً من حل متوافق.\u003c/p>\n  \u003cp>\u003cb>المرحلة الثانية (الربط والتكامل):\u003c/b> تُطبق على موجات حسب حجم الإيرادات، وتتطلب ربط الحل بمنصة «فاتورة» في الهيئة: الفاتورة الضريبية القياسية (للمنشآت) تُعتمد قبل مشاركتها مع المشتري، والمبسطة (للأفراد) تُرسل خلال 24 ساعة، مع رمز QR وتنسيق XML.\u003c/p>", "lesson:core-0": "\u003cp>نجاح تشغيل أي نظام محاسبي يبدأ من إعداد صحيح. الأخطاء في هذه المرحلة (سنة مالية خاطئة، فروع غير مخططة، صلاحيات مفتوحة) تنعكس على كل تقرير لاحق.\u003c/p>\n  \u003ch3>البيانات المطلوبة قبل التأسيس\u003c/h3>\n  \u003cul>\u003cli>اسم المنشأة القانوني، والسجل التجاري، والرقم الضريبي إن كانت مسجلة في ضريبة القيمة المضافة.\u003c/li>\n  \u003cli>العنوان الوطني وبيانات الفروع والمستودعات.\u003c/li>\n  \u003cli>بداية السنة المالية ونهايتها، والعملة الأساسية.\u003c/li>\n  \u003cli>قائمة المستخدمين ومهامهم (محاسب، أمين مستودع، كاشير، مدير).\u003c/li>\u003c/ul>\n  \u003ch3>السنة المالية والفترات\u003c/h3>\n  \u003cp>تُقسَّم السنة المالية عادة إلى فترات شهرية. إقفال الفترة يمنع التعديل على قيودها بعد مراجعتها، وهذا أساس الرقابة. خطّط مع الإدارة متى تُقفل كل فترة ومن يملك صلاحية إعادة فتحها.\u003c/p>\n  \u003ch3>الفروع ومراكز التكلفة والصلاحيات\u003c/h3>\n  \u003cp>الفرع وحدة تشغيلية لها مبيعاتها ومخزونها، ومركز التكلفة وحدة تحليلية لتوزيع المصروفات والإيرادات (مثل: قسم، مشروع، سيارة توزيع). أما الصلاحيات فتحدد ما يراه كل مستخدم وما يستطيع تعديله.\u003c/p>\n  \u003cdiv class=\"note\">\u003cb>تنبيه:\u003c/b> خطوات الشاشات التفصيلية لكل إصدار تُضاف من دليل المستخدم الرسمي عند اعتماده. تعدد الفروع والمستودعات يختلف بحسب الإصدار \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/div>\n  \u003cdiv class=\"tip\">\u003cb>تمرين:\u003c/b> جهّز جدولاً بالفروع والمستودعات والمستخدمين وصلاحية كل مستخدم قبل جلسة التركيب.\u003c/div>", "lesson:core-1": "\u003cp>دليل الحسابات هو العمود الفقري للنظام. كل فاتورة وسند ينتهي بقيد على حسابات هذا الدليل.\u003c/p>\n  \u003ch3>هيكل دليل الحسابات\u003c/h3>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>المجموعة\u003c/th>\u003cth>أمثلة\u003c/th>\u003cth>طبيعة الرصيد\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>الأصول\u003c/td>\u003ctd>الصندوق، البنوك، العملاء، المخزون، الأصول الثابتة\u003c/td>\u003ctd>مدين\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الخصوم\u003c/td>\u003ctd>الموردون، ضريبة القيمة المضافة المستحقة، القروض\u003c/td>\u003ctd>دائن\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>حقوق الملكية\u003c/td>\u003ctd>رأس المال، الأرباح المبقاة، جاري الشريك\u003c/td>\u003ctd>دائن\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الإيرادات\u003c/td>\u003ctd>المبيعات، إيرادات الخدمات\u003c/td>\u003ctd>دائن\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>المصروفات\u003c/td>\u003ctd>الرواتب، الإيجار، الكهرباء، تكلفة المبيعات\u003c/td>\u003ctd>مدين\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>يتكون الدليل من حسابات رئيسية (تجميعية) وحسابات فرعية (تُسجل عليها الحركات). استخدم ترقيماً متسلسلاً يسمح بالإضافة لاحقاً.\u003c/p>\n  \u003ch3>الأرصدة الافتتاحية\u003c/h3>\n  \u003cp>عند الانتقال من نظام سابق، تُدخل أرصدة الحسابات في تاريخ بداية التشغيل. يجب أن يتساوى مجموع الأرصدة المدينة مع مجموع الأرصدة الدائنة، وأن تطابق أرصدة العملاء والموردين والمخزون كشوفاتها التفصيلية.\u003c/p>\n  \u003ch3>القيود والسندات\u003c/h3>\n  \u003cul>\u003cli>\u003cb>قيد اليومية:\u003c/b> لتسجيل أي عملية مالية بطرف مدين وطرف دائن متساويين.\u003c/li>\n  \u003cli>\u003cb>سند القبض:\u003c/b> استلام نقد أو شيك أو تحويل (الصندوق/البنك مدين، الطرف الدافع دائن).\u003c/li>\n  \u003cli>\u003cb>سند الصرف:\u003c/b> دفع مبلغ (المصروف أو المورد مدين، الصندوق/البنك دائن).\u003c/li>\u003c/ul>\n  \u003cdiv class=\"tip\">\u003cb>مثال:\u003c/b> دفع إيجار المحل 5,000 ريال نقداً: مصروف الإيجار مدين 5,000، الصندوق دائن 5,000.\u003c/div>", "lesson:core-2": "\u003cp>المخزون أكبر أصل في أغلب المنشآت التجارية، ودقته تحدد دقة الأرباح.\u003c/p>\n  \u003ch3>بطاقة الصنف\u003c/h3>\n  \u003cul>\u003cli>الاسم والرمز والمجموعة.\u003c/li>\u003cli>الوحدات ومعامل التحويل بينها (مثال: كرتون = 12 حبة).\u003c/li>\u003cli>الباركود لكل وحدة.\u003c/li>\u003cli>أسعار البيع وحالة الخضوع للضريبة.\u003c/li>\u003c/ul>\n  \u003ch3>المستودعات والتحويلات\u003c/h3>\n  \u003cp>التحويل بين المستودعات ينقل الكمية دون أن يؤثر على إجمالي قيمة المخزون في المنشأة. أما الصرف للاستهلاك أو التالف فيُخفض المخزون ويُحمَّل على مصروف.\u003c/p>\n  \u003ch3>تكلفة المخزون\u003c/h3>\n  \u003cp>من الطرق الشائعة: \u003cb>المتوسط المرجح\u003c/b> (تُحسب التكلفة كمتوسط لكل الكميات المشتراة) و\u003cb>الوارد أولاً صادر أولاً\u003c/b>. الطريقة المطبقة في كل إصدار تُؤكد من الفريق الفني \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/p>\n  \u003cdiv class=\"tip\">\u003cb>مثال المتوسط المرجح:\u003c/b> 10 حبات بسعر 20 + 10 حبات بسعر 30 = 500 ريال ÷ 20 حبة = 25 ريال تكلفة الحبة.\u003c/div>", "lesson:core-3": "\u003ch3>دورة المشتريات\u003c/h3>\n  \u003col>\u003cli>طلب الشراء أو أمر الشراء.\u003c/li>\u003cli>استلام البضاعة وفحصها.\u003c/li>\u003cli>فاتورة المشتريات: تزيد المخزون وضريبة المدخلات ورصيد المورد.\u003c/li>\u003cli>السداد بسند صرف وتخفيض رصيد المورد.\u003c/li>\u003c/ol>\n  \u003ch3>مرتجع المشتريات\u003c/h3>\n  \u003cp>يعكس أثر الفاتورة: يُخفض المخزون ورصيد المورد وضريبة المدخلات بقيمة المرتجع.\u003c/p>\n  \u003ch3>تكاليف الشراء\u003c/h3>\n  \u003cp>الشحن والجمارك والتخليص على البضاعة المشتراة جزء من تكلفتها، وتوزيعها على الأصناف يعطي تكلفة حقيقية وأرباحاً دقيقة.\u003c/p>\n  \u003ch3>متابعة الموردين\u003c/h3>\n  \u003cp>كشف حساب المورد يعرض الفواتير والمرتجعات والمدفوعات. طابقه دورياً مع كشف المورد نفسه.\u003c/p>", "lesson:core-4": "\u003ch3>فواتير المبيعات\u003c/h3>\n  \u003cp>الفاتورة النقدية تزيد الصندوق أو البنك، والآجلة تزيد رصيد العميل. كلاهما يزيد المبيعات وضريبة المخرجات ويخفض المخزون ويثبت تكلفة المبيعات.\u003c/p>\n  \u003ch3>الخصومات والتسعيرات والمرتجعات\u003c/h3>\n  \u003cul>\u003cli>حدد من يملك صلاحية منح الخصم وحدوده.\u003c/li>\u003cli>قوائم الأسعار تسمح بأسعار مختلفة (تجزئة، جملة).\u003c/li>\u003cli>مرتجع المبيعات يعكس أثر الفاتورة ويُرجع الكمية للمخزون.\u003c/li>\u003c/ul>\n  \u003ch3>العملاء والتحصيل\u003c/h3>\n  \u003cp>تقرير أعمار الديون يصنف أرصدة العملاء حسب مدة التأخر (مثلاً 0 إلى 30، و31 إلى 60، وأكثر من 90 يوماً) ويحدد أولويات التحصيل.\u003c/p>\n  \u003ch3>نقاط البيع والكاشير\u003c/h3>\n  \u003col>\u003cli>فتح الوردية برصيد افتتاحي معروف.\u003c/li>\u003cli>البيع بالنقد أو الشبكة.\u003c/li>\u003cli>إقفال الوردية: عدّ النقد ومطابقته مع النظام، ومطابقة الشبكة مع تقرير الجهاز.\u003c/li>\u003cli>تسجيل العجز أو الزيادة واعتمادها من المشرف.\u003c/li>\u003c/ol>\n  \u003cdiv class=\"note\">\u003cb>ملاحظة:\u003c/b> طرق الدفع والتكامل مع أجهزة الشبكة والطابعات والموازين تحتاج توثيقاً لكل إصدار \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/div>", "lesson:core-5": "\u003ch3>ضريبة القيمة المضافة في العمليات اليومية\u003c/h3>\n  \u003cp>ضريبة المخرجات تُحصّل من العملاء على المبيعات، وضريبة المدخلات تُدفع للموردين على المشتريات. المستحق للهيئة = المخرجات − المدخلات القابلة للخصم.\u003c/p>\n  \u003cdiv class=\"tip\">\u003cb>مثال:\u003c/b> مبيعات 100,000 ريال (ضريبة 15,000) ومشتريات 60,000 ريال (ضريبة 9,000). الصافي المستحق = 15,000 − 9,000 = 6,000 ريال.\u003c/div>\n  \u003ch3>الفوترة الإلكترونية\u003c/h3>\n  \u003cp>دعم المرحلة الثانية من الفوترة الإلكترونية ضمن منظومة الشامل بحسب المعلومات المتوفرة، وحالة كل إصدار تحتاج توثيقاً \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>. التفاصيل النظامية في مساق «الأنظمة السعودية».\u003c/p>\n  \u003ch3>التقارير المالية\u003c/h3>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>التقرير\u003c/th>\u003cth>يجيب عن سؤال\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>ميزان المراجعة\u003c/td>\u003ctd>هل الحسابات متوازنة؟ وما رصيد كل حساب؟\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الأستاذ العام\u003c/td>\u003ctd>ما الحركات التي أثرت على حساب معين؟\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>قائمة الدخل\u003c/td>\u003ctd>هل حققت المنشأة ربحاً في الفترة؟\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>قائمة المركز المالي\u003c/td>\u003ctd>ما الأصول والخصوم وحقوق الملكية في تاريخ معين؟\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>التدفقات النقدية\u003c/td>\u003ctd>من أين جاء النقد وأين صُرف؟\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>وهناك تقارير تجارية (المبيعات والأرباح حسب الصنف والفرع، أرصدة المخزون) ورقابية (حركة المستخدمين والصناديق، العجز والزيادة، الخصومات والمرتجعات). قائمة التقارير المتوفرة فعلياً في كل إصدار قيد الحصر \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/p>", "lesson:core-6": "\u003ch3>الجرد الفعلي\u003c/h3>\n  \u003col>\u003cli>إيقاف الحركة على المستودع أو تحديد وقت قطع واضح.\u003c/li>\u003cli>العدّ الفعلي بفريق مستقل عن أمين المستودع.\u003c/li>\u003cli>مقارنة الكميات الفعلية بأرصدة النظام.\u003c/li>\u003cli>اعتماد التسوية: العجز يُحمّل على حساب مصروف، والزيادة تُدرس سببها قبل اعتمادها.\u003c/li>\u003c/ol>\n  \u003ch3>الإقفال\u003c/h3>\n  \u003cul>\u003cli>مراجعة ميزان المراجعة ومطابقة البنوك والصناديق.\u003c/li>\u003cli>مطابقة أرصدة العملاء والموردين والمخزون مع الحسابات الإجمالية.\u003c/li>\u003cli>إقفال الفترة لمنع التعديل.\u003c/li>\u003cli>في نهاية السنة: إقفال الإيرادات والمصروفات في الأرباح والخسائر وترحيل الأرصدة للسنة الجديدة.\u003c/li>\u003c/ul>\n  \u003cdiv class=\"note\">\u003cb>تنبيه:\u003c/b> النسخ الاحتياطي قبل الإقفال السنوي ضروري. آلية النسخ الاحتياطي والاستعادة في كل إصدار تحتاج توثيقاً فنياً \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/div>\n  \u003ch3>الحالة العملية\u003c/h3>\n  \u003cp>منشأة تموينات لها فرع ومستودع واحد. نفّذ بالترتيب: تأسيس المنشأة، إضافة 5 أصناف بوحدتين، فاتورة شراء آجلة، فاتورة بيع نقدية وأخرى آجلة، سند قبض من العميل، سند صرف للمورد، وردية كاشير، جرد، ثم استخرج ميزان المراجعة وقائمة الدخل.\u003c/p>", "lesson:versions-0": "\u003cp>تقدم شركة أمان الحديثة لتقنية نظم المعلومات حلول «المحاسب الشامل» للمحاسبة وإدارة المنشآت والمخزون والمبيعات ونقاط البيع، مع خدمات التركيب والتدريب والدعم والصيانة.\u003c/p>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>الإصدار\u003c/th>\u003cth>النوع\u003c/th>\u003cth>الفئة المستهدفة\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>\u003cb>المحاسب الشامل\u003c/b>\u003c/td>\u003ctd>مكتبي\u003c/td>\u003ctd>المنشآت الصغيرة والمتوسطة\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>الشامل بلس\u003c/b>\u003c/td>\u003ctd>مكتبي متقدم\u003c/td>\u003ctd>الشركات متعددة الفروع والمستودعات\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>الشامل ويب\u003c/b> (المحاسب الشامل السحابي)\u003c/td>\u003ctd>سحابي عبر المتصفح\u003c/td>\u003ctd>من يحتاج العمل من أي مكان\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>أولتكس\u003c/b>\u003c/td>\u003ctd>مكتبي اقتصادي\u003c/td>\u003ctd>المنشآت التي تبحث عن حل بتكلفة أقل\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>تروست ويب\u003c/b>\u003c/td>\u003ctd>ويب\u003c/td>\u003ctd>الخصائص قيد التوثيق \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>وصل ERP\u003c/b>\u003c/td>\u003ctd>نظام ERP\u003c/td>\u003ctd>الخصائص قيد التوثيق \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>وصل مطاعم\u003c/b>\u003c/td>\u003ctd>نظام للمطاعم\u003c/td>\u003ctd>الخصائص قيد التوثيق \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>الشامل لايت\u003c/b>\u003c/td>\u003ctd>تطبيق جوال\u003c/td>\u003ctd>يرتبط مع المحاسب الشامل والشامل بلس والشامل ويب\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>الشامل برو\u003c/b>\u003c/td>\u003ctd>تطبيق جوال\u003c/td>\u003ctd>الوظائف قيد التوثيق \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>تعمل النسخ المكتبية على Windows، ويعتمد المحاسب الشامل المكتبي على قاعدة بيانات Oracle، بحسب المعلومات المتوفرة \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>. ويعمل الشامل ويب عبر المتصفح.\u003c/p>", "lesson:versions-1": "\u003cp>يُبنى نظام المنشأة من \u003cb>رخصة رئيسية\u003c/b> (ديسكتوب أو ويب) تُضاف إليها طرفيات ونقاط بيع بحسب عدد المستخدمين والكاشيرات.\u003c/p>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>المنتج\u003c/th>\u003cth>الرئيسية\u003c/th>\u003cth>الطرفيات والمستخدمون\u003c/th>\u003cth>نقاط البيع\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>\u003cb>المحاسب الشامل\u003c/b>\u003c/td>\u003ctd>ديسكتوب\u003c/td>\u003ctd>طرفية المحاسب الشامل · طرفية أونلاين\u003c/td>\u003ctd>نقطة بيع · نقطة بيع مطاعم\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>الشامل بلس\u003c/b>\u003c/td>\u003ctd>ديسكتوب\u003c/td>\u003ctd>طرفية الشامل بلس · طرفية أونلاين بلس\u003c/td>\u003ctd>نقطة بيع بلس · نقطة بيع بلس مطاعم\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>الشامل ويب\u003c/b>\u003c/td>\u003ctd>ويب\u003c/td>\u003ctd>يوزرات (مستخدمو) ويب\u003c/td>\u003ctd>نقاط بيع ويب · الشامل ويب مطاعم\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>أولتكس\u003c/b>\u003c/td>\u003ctd>ديسكتوب\u003c/td>\u003ctd>طرفية أولتكس\u003c/td>\u003ctd>غير مدرجة\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cul>\u003cli>\u003cb>الطرفية:\u003c/b> مستخدم إضافي على الشبكة المحلية.\u003c/li>\n  \u003cli>\u003cb>الطرفية الأونلاين:\u003c/b> مستخدم يتصل بالنظام المكتبي عن بُعد.\u003c/li>\n  \u003cli>\u003cb>نقطة البيع:\u003c/b> رخصة كاشير لتسجيل المبيعات المباشرة.\u003c/li>\n  \u003cli>\u003cb>نقطة بيع مطاعم:\u003c/b> نسخة نقطة البيع الموجهة للمطاعم والكافيهات، والفروق التفصيلية عن نقطة البيع العادية قيد التوثيق \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/li>\n  \u003cli>\u003cb>يوزرات الويب:\u003c/b> مستخدمون إضافيون على الشامل ويب، وللويب رسوم تجديد.\u003c/li>\n  \u003cli>\u003cb>طرفية وربط «جرافون»:\u003c/b> واردة في قائمة الأسعار، وتعريفها الفني يحتاج توثيقاً \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/li>\u003c/ul>\n  \u003cp>تشمل الخدمات المرافقة: الصيانة السنوية والتحديثات، ربط الفروع والأجهزة، التدريب، ترحيل البيانات، والتخصيصات بحسب الاتفاق.\u003c/p>\n  \u003cdiv class=\"note\">\u003cb>مهم:\u003c/b> عدم ظهور سعر لخاصية في إصدار معين لا يعني عدم دعمها. اطلب تأكيداً فنياً من الشركة قبل الاعتماد على أي خاصية في عقد أو عرض رسمي. للأسعار الحالية تواصل مع فريق المبيعات.\u003c/div>", "lesson:versions-2": "\u003ch3>أسئلة الاختيار\u003c/h3>\n  \u003col>\u003cli>كم فرعاً ومستودعاً لديك الآن وخلال سنتين؟\u003c/li>\u003cli>هل تحتاج الدخول من أي مكان دون خادم داخلي؟\u003c/li>\u003cli>كم مستخدماً ونقطة بيع تحتاج؟\u003c/li>\u003cli>هل تحتاج تطبيق جوال للإدارة؟\u003c/li>\u003cli>ما ميزانيتك للترخيص والتجديد والصيانة؟\u003c/li>\u003c/ol>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>إذا كان احتياجك\u003c/th>\u003cth>فابدأ بدراسة\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>منشأة صغيرة أو متوسطة بفرع أو فرعين\u003c/td>\u003ctd>المحاسب الشامل\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>عدة فروع ومستودعات وحجم عمليات كبير\u003c/td>\u003ctd>الشامل بلس\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>عمل عن بُعد وعدم الرغبة في إدارة خوادم\u003c/td>\u003ctd>الشامل ويب\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>ميزانية محدودة واحتياج أساسي\u003c/td>\u003ctd>أولتكس\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>مطعم أو كافيه\u003c/td>\u003ctd>نقطة بيع مطاعم ضمن الشامل أو بلس أو ويب، أو وصل مطاعم\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>القطاعات المستهدفة واسعة: التجزئة والجملة، مواد البناء، قطع الغيار، المطاعم والكافيهات، الصيدليات، المصانع والمقاولات وغيرها، وبعضها يحتاج تخصيصات. القرار النهائي يكون بعد عرض توضيحي واستشارة مع الشركة.\u003c/p>", "lesson:acct-0": "\u003cp>\u003cb>الأصول = الخصوم + حقوق الملكية\u003c/b>. كل عملية تؤثر على طرفين على الأقل وتبقي المعادلة متوازنة.\u003c/p>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>نوع الحساب\u003c/th>\u003cth>يزيد بـ\u003c/th>\u003cth>ينقص بـ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>الأصول والمصروفات\u003c/td>\u003ctd>المدين\u003c/td>\u003ctd>الدائن\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الخصوم وحقوق الملكية والإيرادات\u003c/td>\u003ctd>الدائن\u003c/td>\u003ctd>المدين\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"tip\">\u003cb>مثال:\u003c/b> شراء بضاعة آجلة بـ10,000: المخزون (أصل) مدين 10,000 والمورد (خصم) دائن 10,000. زاد الطرفان فبقيت المعادلة متوازنة.\u003c/div>", "lesson:acct-1": "\u003col>\u003cli>حدوث العملية ووجود مستند (فاتورة، سند، عقد).\u003c/li>\u003cli>التسجيل في اليومية.\u003c/li>\u003cli>الترحيل إلى الأستاذ العام.\u003c/li>\u003cli>إعداد ميزان المراجعة.\u003c/li>\u003cli>التسويات (المستحقات والمقدمات والإهلاك).\u003c/li>\u003cli>إعداد القوائم المالية.\u003c/li>\u003cli>الإقفال.\u003c/li>\u003c/ol>\n  \u003cp>في الأنظمة المحاسبية تتم خطوات التسجيل والترحيل آلياً عند حفظ المستند، ويبقى دور المحاسب في المراجعة والتسويات والإقفال.\u003c/p>", "lesson:acct-2": "\u003ch3>قائمة الدخل\u003c/h3>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003ctbody>\n  \u003ctr>\u003ctd>المبيعات\u003c/td>\u003ctd class=\"num\">500,000\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>تكلفة المبيعات\u003c/td>\u003ctd class=\"num\">(350,000)\u003c/td>\u003c/tr>\n  \u003ctr>\u003cth>مجمل الربح\u003c/th>\u003cth class=\"num\">150,000\u003c/th>\u003c/tr>\n  \u003ctr>\u003ctd>المصروفات التشغيلية\u003c/td>\u003ctd class=\"num\">(90,000)\u003c/td>\u003c/tr>\n  \u003ctr>\u003cth>صافي الربح\u003c/th>\u003cth class=\"num\">60,000\u003c/th>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>هامش مجمل الربح = 150,000 ÷ 500,000 = 30%.\u003c/p>\n  \u003ch3>قائمة المركز المالي\u003c/h3>\n  \u003cp>صورة في تاريخ محدد للأصول والخصوم وحقوق الملكية. قائمة الدخل تغطي فترة، والمركز المالي يمثل لحظة.\u003c/p>", "lesson:acct-3": "\u003cp>\u003cb>معدل دوران المخزون\u003c/b> = تكلفة المبيعات ÷ متوسط المخزون. ارتفاعه يعني أن البضاعة تُباع بسرعة.\u003c/p>\n  \u003cdiv class=\"tip\">\u003cb>مثال:\u003c/b> تكلفة مبيعات 360,000 ومتوسط مخزون 60,000: الدوران 6 مرات في السنة، أي أن البضاعة تبقى قرابة شهرين.\u003c/div>\n  \u003cp>\u003cb>الذمم المدينة\u003c/b> أموال للمنشأة عند العملاء. كلما طال تأخرها زاد خطر عدم تحصيلها، لذلك يُتابع تقرير أعمار الديون أسبوعياً أو شهرياً.\u003c/p>", "lesson:ksa-0": "\u003cdiv class=\"note\">\u003cb>ملخص تعليمي\u003c/b> محدَّث حتى نوفمبر 2026. الأنظمة تتغير، فارجع دائماً إلى موقع هيئة الزكاة والضريبة والجمارك (zatca.gov.sa) قبل أي قرار.\u003c/div>\n  \u003cul>\u003cli>\u003cb>النسبة الأساسية:\u003c/b> 15% منذ 1 يوليو 2020 (كانت 5% منذ تطبيقها في 1 يناير 2018).\u003c/li>\n  \u003cli>\u003cb>التسجيل الإلزامي:\u003c/b> إذا تجاوزت التوريدات الخاضعة للضريبة 375,000 ريال سنوياً.\u003c/li>\n  \u003cli>\u003cb>التسجيل الاختياري:\u003c/b> إذا تجاوزت 187,500 ريال.\u003c/li>\n  \u003cli>\u003cb>الإقرار:\u003c/b> شهري للمنشآت التي تتجاوز توريداتها السنوية 40 مليون ريال، وربع سنوي لغيرها، ويُقدم ويُسدد قبل نهاية الشهر التالي للفترة.\u003c/li>\n  \u003cli>\u003cb>الاحتفاظ بالسجلات:\u003c/b> الفواتير والسجلات المحاسبية تُحفظ 6 سنوات بشكل عام (وقد تطول في حالات مثل العقار والأصول الرأسمالية).\u003c/li>\u003c/ul>\n  \u003ch3>بيانات الفاتورة الضريبية الأساسية\u003c/h3>\n  \u003cp>اسم البائع وعنوانه ورقمه الضريبي، تاريخ الإصدار ورقم تسلسلي، وصف السلع أو الخدمات والكميات، السعر قبل الضريبة، نسبة الضريبة ومبلغها، والإجمالي شاملاً الضريبة. وتتضمن الفاتورة بين المنشآت بيانات المشتري ورقمه الضريبي.\u003c/p>", "lesson:ksa-1": "\u003ch3>المراحل\u003c/h3>\n  \u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>المرحلة\u003c/th>\u003cth>التاريخ\u003c/th>\u003cth>المضمون\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>الأولى: الإصدار\u003c/td>\u003ctd>4 ديسمبر 2021\u003c/td>\u003ctd>إصدار الفواتير وحفظها إلكترونياً ومنع الفواتير اليدوية والنصية القابلة للتعديل\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>الثانية: الربط والتكامل\u003c/td>\u003ctd>من 1 يناير 2023 على موجات\u003c/td>\u003ctd>ربط نظام الفوترة بمنصة «فاتورة» لدى الهيئة؛ تُبلَّغ كل منشأة بموعد موجتها\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003ch3>أنواع المستندات\u003c/h3>\n  \u003cul>\u003cli>\u003cb>الفاتورة الضريبية القياسية\u003c/b> (بين المنشآت): تمر بإجراء \u003cb>الاعتماد\u003c/b> (Clearance) من الهيئة قبل مشاركتها مع المشتري.\u003c/li>\n  \u003cli>\u003cb>الفاتورة الضريبية المبسطة\u003c/b> (للمستهلك): تُشارك مع العميل ثم \u003cb>تُبلَّغ\u003c/b> (Reporting) للهيئة خلال 24 ساعة، وتحمل رمز الاستجابة السريعة QR.\u003c/li>\n  \u003cli>\u003cb>الإشعارات الدائنة والمدينة:\u003c/b> لتعديل فاتورة صادرة (مرتجع، خصم لاحق، تصحيح) بدلاً من تعديل الفاتورة نفسها.\u003c/li>\u003c/ul>\n  \u003ch3>في المحاسب الشامل\u003c/h3>\n  \u003cp>دعم المرحلة الثانية ضمن منظومة الشامل بحسب المعلومات المتوفرة، ويلزم توثيق حالة كل إصدار واختبار الفواتير القياسية والمبسطة والإشعارات وQR والربط مع الهيئة \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>. لا يُشار إلى اعتماد رسمي إلا بمستند.\u003c/p>", "lesson:ksa-2": "\u003cul>\u003cli>\u003cb>النسبة:\u003c/b> 2.5% من الوعاء الزكوي للسنة الهجرية، وتعادل تقريباً 2.5778% عند استخدام السنة الميلادية.\u003c/li>\n  \u003cli>\u003cb>الوعاء الزكوي:\u003c/b> يُحسب وفق اللائحة التنفيذية لجباية الزكاة، وينطلق من مصادر التمويل (حقوق الملكية والتمويل طويل الأجل وما في حكمها) بعد حسم الاستثمارات والأصول المسموح بحسمها، ولا يقل عن صافي الربح المعدل.\u003c/li>\n  \u003cli>\u003cb>الإقرار:\u003c/b> يُقدم ويُسدد خلال 120 يوماً من نهاية السنة المالية.\u003c/li>\n  \u003cli>المنشآت المملوكة لغير سعوديين أو المختلطة تخضع لضريبة الدخل على حصة غير السعودي بحسب نظامها.\u003c/li>\u003c/ul>\n  \u003cdiv class=\"note\">\u003cb>تنبيه:\u003c/b> حساب الوعاء الزكوي تفصيلي وتحكمه اللائحة الصادرة عن الهيئة؛ استعن بمختص للحالات المعقدة.\u003c/div>", "lesson:ksa-3": "\u003cdiv class=\"note\">\u003cb>ملخص تعليمي:\u003c/b> ارجع إلى نظام العمل ولوائحه على موقع وزارة الموارد البشرية والتنمية الاجتماعية (hrsd.gov.sa) لأي حالة فعلية.\u003c/div>\n  \u003cul>\u003cli>\u003cb>ساعات العمل:\u003c/b> 8 ساعات يومياً أو 48 أسبوعياً، وتُخفض في رمضان للمسلمين إلى 6 ساعات يومياً أو 36 أسبوعياً.\u003c/li>\n  \u003cli>\u003cb>العمل الإضافي:\u003c/b> يُدفع عنه أجر الساعة مضافاً إليه 50% من الأجر الأساسي.\u003c/li>\n  \u003cli>\u003cb>الإجازة السنوية:\u003c/b> 21 يوماً، وتصبح 30 يوماً بعد خمس سنوات متصلة لدى صاحب العمل.\u003c/li>\n  \u003cli>\u003cb>مكافأة نهاية الخدمة:\u003c/b> أجر نصف شهر عن كل سنة من السنوات الخمس الأولى، وأجر شهر عن كل سنة بعدها، وتُحتسب على آخر أجر.\u003c/li>\n  \u003cli>\u003cb>حماية الأجور:\u003c/b> صرف الرواتب عبر البنوك ورفع ملفاتها في نظام حماية الأجور.\u003c/li>\n  \u003cli>\u003cb>التأمينات الاجتماعية:\u003c/b> تسجيل العاملين واشتراكاتهم الشهرية لدى المؤسسة العامة للتأمينات الاجتماعية.\u003c/li>\u003c/ul>\n  \u003cdiv class=\"tip\">\u003cb>مثال مكافأة:\u003c/b> موظف خدم 7 سنوات وآخر أجر 6,000 ريال: (5 × 3,000) + (2 × 6,000) = 27,000 ريال، قبل تطبيق أحكام الاستقالة إن وُجدت.\u003c/div>\n  \u003cp>توفر وحدة الرواتب في المحاسب الشامل يختلف بحسب الإصدار \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/p>", "lesson:admin-0": "\u003cp>مبدأ \u003cb>فصل المهام\u003c/b>: لا يجمع شخص واحد بين تنفيذ العملية وتسجيلها واعتمادها. مثال: من يستلم النقد لا يعتمد العجز في صندوقه.\u003c/p>\n  \u003cul>\u003cli>امنح كل مستخدم أقل صلاحية تكفي عمله.\u003c/li>\u003cli>قيّد الحذف والتعديل على المستندات المرحّلة.\u003c/li>\u003cli>حدد سقفاً للخصم لكل مستخدم.\u003c/li>\u003cli>راجع قائمة المستخدمين عند تغيّر الموظفين وأوقف الحسابات فوراً عند المغادرة.\u003c/li>\u003c/ul>", "lesson:admin-1": "\u003col>\u003cli>إقفال يومي لكل وردية مع عدّ النقد بحضور المشرف.\u003c/li>\u003cli>إيداع النقد في البنك بانتظام وعدم ترك مبالغ كبيرة في الصندوق.\u003c/li>\u003cli>مطابقة مبيعات الشبكة مع تقارير الأجهزة وكشف البنك.\u003c/li>\u003cli>مراجعة تقارير المرتجعات والخصومات والإلغاءات لكل كاشير.\u003c/li>\u003cli>متابعة تقرير العجز والزيادة أسبوعياً.\u003c/li>\u003c/ol>", "lesson:admin-2": "\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>الدورية\u003c/th>\u003cth>التقرير\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  \u003ctr>\u003ctd>يومي\u003c/td>\u003ctd>المبيعات والتحصيل حسب الفرع والكاشير، العجز والزيادة\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>أسبوعي\u003c/td>\u003ctd>أعمار الديون، الأصناف الراكدة والناقصة، الخصومات والمرتجعات\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>شهري\u003c/td>\u003ctd>قائمة الدخل، الأرباح حسب الصنف والفرع، ميزان المراجعة، مطابقات البنوك\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp>هذه التقارير ضمن قائمة التقارير المطلوب حصرها في المحاسب الشامل، وتوفرها الفعلي يختلف بحسب الإصدار \u003cspan class=\"chip warn\">تحتاج تأكيداً\u003c/span>\u003c/p>"};</script>
