<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="logos/aman.png">
<title>بوابة مهندسي الصيانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: dark navy service rail on the right (RTL), working canvas on the left; drawer slides in for a ticket or a record. */
:root{
  --bg:#EFF3F7; --panel:#FFFFFF; --panel-2:#F6F9FB; --ink:#0D1F33; --muted:#566779; --line:#D8E0E8;
  --accent:#1590C2; --accent-ink:#0A6A92; --accent-soft:#E1F1F8;
  --crit:#C2382E; --crit-soft:#FBE6E4; --warn:#B86E05; --warn-soft:#FCF0DC; --ok:#1C8456; --ok-soft:#DFF3E9; --idle:#6B7A8A; --idle-soft:#E9EEF2;
  --rail:#0F2C4B; --rail-2:#163A60; --rail-ink:#D6E4F0; --rail-muted:#8FA9C2;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(13,31,51,.06),0 6px 20px rgba(13,31,51,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A141E; --panel:#101D2A; --panel-2:#0D1824; --ink:#E3ECF4; --muted:#8FA2B5; --line:#203344;
  --accent:#3DB3E2; --accent-ink:#7FD0F0; --accent-soft:#12303F;
  --crit:#F26B5E; --crit-soft:#3A1A18; --warn:#EBA43F; --warn-soft:#352714; --ok:#43C186; --ok-soft:#13311F; --idle:#93A4B4; --idle-soft:#1A2836;
  --rail:#07121D; --rail-2:#10233A; --rail-ink:#D6E4F0; --rail-muted:#7F97AE; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A141E; --panel:#101D2A; --panel-2:#0D1824; --ink:#E3ECF4; --muted:#8FA2B5; --line:#203344;
  --accent:#3DB3E2; --accent-ink:#7FD0F0; --accent-soft:#12303F;
  --crit:#F26B5E; --crit-soft:#3A1A18; --warn:#EBA43F; --warn-soft:#352714; --ok:#43C186; --ok-soft:#13311F; --idle:#93A4B4; --idle-soft:#1A2836;
  --rail:#07121D; --rail-2:#10233A; --rail-ink:#D6E4F0; --rail-muted:#7F97AE; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding-block:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding-inline:16px}
.brand img{width:44px;height:44px;border-radius:9px;background:#fff;object-fit:contain}
.brand b{font-family:var(--f-display);font-size:15px;display:block}
.brand small{color:var(--rail-muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;padding-inline:8px}
.nav .grp{font-size:11px;letter-spacing:.06em;color:var(--rail-muted);padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--rail-2)}
.nav a.on{background:var(--rail-2);box-shadow:inset -3px 0 0 var(--accent)}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a .cnt{margin-inline-start:auto;font-family:var(--f-mono);font-size:12px;background:rgba(255,255,255,.1);padding:0 7px;border-radius:20px}
.top.locked .search,.top.locked #bell,.top.locked .btn{display:none}
.nav a .cnt.hot{background:var(--crit);color:#fff}
.me{margin:auto 12px 0;padding:10px;border-radius:9px;background:var(--rail-2);font-size:13px}
.me label{color:var(--rail-muted);font-size:12px;display:block;margin-bottom:4px}
.me select{width:100%;background:var(--rail);color:var(--rail-ink);border:1px solid #2B4D72;border-radius:7px;padding:6px}
/* main */
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:20px;flex:1;min-width:0}
.search{position:relative;width:min(300px,40vw)}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px}
.view{padding-block:20px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#04202D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#04202D}}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--panel);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.iconbtn .dot{position:absolute;top:-5px;left:-5px;background:var(--crit);color:#fff;font-size:11px;font-family:var(--f-mono);min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:15.5px;flex:1}
.panel .body{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1.2}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
/* lists */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-bottom:0;text-align:start;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--panel-2)}
.row .t,.row .s{display:block}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stripe{width:4px;align-self:stretch;border-radius:3px;background:var(--idle)}
.stripe.p1{background:var(--crit)} .stripe.p2{background:var(--warn)} .stripe.p3{background:var(--accent)} .stripe.p4{background:var(--idle)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:20px;white-space:nowrap;background:var(--idle-soft);color:var(--idle)}
.pill.new{background:var(--accent-soft);color:var(--accent-ink)}
.pill.assigned{background:var(--idle-soft);color:var(--ink)}
.pill.progress{background:var(--warn-soft);color:var(--warn)}
.pill.waiting{background:var(--idle-soft);color:var(--idle)}
.pill.done,.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);margin-bottom:4px}
table{width:100%;border-collapse:collapse}
.tbl{overflow-x:auto}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--panel-2);white-space:nowrap}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:end}
th.num{font-family:var(--f-body)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--idle-soft);border-radius:5px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .fill.warn{background:var(--warn)} .bar .fill.crit{background:var(--crit)} .bar .fill.ok{background:var(--ok)}
.bar .n{font-family:var(--f-mono);text-align:end}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.banner.info{background:var(--accent-soft)}
.note{font-size:12.5px;color:var(--muted);border-inline-start:3px solid var(--line);padding-inline-start:10px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,25,.45);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(640px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer>header{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer>header h2{font-size:17px;flex:1;min-width:0}
.drawer .dbody{overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.timeline{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px}
.timeline li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
.timeline li.sys::before{background:var(--idle)}
.timeline .meta{font-size:12px;color:var(--muted)}
.cl{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.cl label{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:7px;cursor:pointer}
.cl label:hover{background:var(--panel-2)}
.cl input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.cl .done{color:var(--muted);text-decoration:line-through}
.prog{height:6px;background:var(--idle-soft);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.lic{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 70px 34px;gap:8px;align-items:end}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:8px;z-index:30;font-weight:600}
.day{font-family:var(--f-display);font-size:14px;padding:10px 16px;background:var(--panel-2);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.day:first-child{border-top:0}
.card-tpl{display:flex;flex-direction:column;gap:8px}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:20px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding-block:10px;gap:8px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav .grp{display:none}
  .nav a{white-space:nowrap;flex:none}
  .me{margin:0 12px}
  .top{position:static;flex-wrap:wrap}
  .search{width:100%;order:5}
  .form{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:100px minmax(0,1fr)}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row>:last-child{grid-column:2}
  .bar{grid-template-columns:90px minmax(0,1fr) 36px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slin .18s ease-out}@keyframes slin{from{transform:translateX(-30px);opacity:.6}}}
</style>
<style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<script src="assets/config.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/api.js"></script>
<script src="assets/eng-api.js"></script>
</head>
<body>


<div class="app" dir="rtl" lang="ar">
  <aside class="rail">
    <div class="brand"><img alt="أمان الحديثة" src="logos/aman.png"><div><b>بوابة الصيانة والدعم</b><small>أمان الحديثة · المحاسب الشامل</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><label for="meSel">عرض المنصة كمهندس</label><select id="meSel"></select></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="pageTitle">لوحة التشغيل</h1>
      <div class="search"><input id="gq" type="search" placeholder="ابحث برقم البلاغ أو العميل أو الجوال" aria-label="بحث"></div>
      <button class="iconbtn" id="bell" aria-label="الإشعارات"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="dot" id="bellDot" hidden></span></button>
      <button class="btn pri" data-act="newTicket">+ بلاغ جديد</button><button class="btn ghost" data-act="signout" title="تسجيل الخروج">خروج</button>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="drawerHost"></div>
<div class="toast" id="toast" hidden></div>

<script>

 {k:'shamel',n:'المحاسب الشامل',kind:'ديسكتوب',items:[['main','الرئيسية',4600],['term','طرفية محلية',2000],['online','طرفية أونلاين',1500],['grafon','طرفية جرافون',1500],['pos','نقطة بيع',1950],['posr','نقطة بيع مطاعم',null],['lite','الشامل لايت (جوال)',2000]]},

 {k:'web',n:'الشامل ويب',kind:'سحابي',items:[['main','الرئيسية',4500],['user','يوزر ويب',2000],['pos','نقطة بيع ويب',2000],['posr','الشامل ويب مطاعم',null]]},

async function saveRes(f){const col=f.dataset.col,cfg=RES[col];const id=f.dataset.id||rid();const old=S.res[col].find(r=>r.id===id)||{};

  const file=f.querySelector('#rf_file')&&f.querySelector('#rf_file').files[0];
  if(file){if(file.size>20*1024*1024){toast('الملف أكبر من 20 ميجابايت. ضع رابط تحميل بدلاً منه.');return}
    toast('جارٍ رفع الملف…');try{const a=await S.assets.upload(file);d.fileUrl=a.url;d.fileId=a.id;d.fileName=file.name}catch(e){toast('تعذّر رفع الملف: '+((e&&e.code)||''));return}}
  d.updatedAt=now();if(await write(col,id,d)){toast('حُفظ');openDrawer('resv:'+col+'|'+id)}}

  if(S.isAdmin){try{S.assets=await claude.use('assets')}catch(e){}}
  const sub=(col,fn)=>db.collection(col).onSnapshot(snap=>{fn(snap.docs.map(d=>Object.assign({id:d.id},d.data())));schedule()},()=>{});
  sub('releases',a=>S.res.releases=a);sub('drivers',a=>S.res.drivers=a);sub('tools',a=>S.res.tools=a);sub('trials',a=>S.trials=a);

  [['engineers','eng'],['customers','cust'],['tickets','tix'],['kb','kb']].forEach(([col,key])=>{
    db.collection(col).onSnapshot(snap=>{
      S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(!snap.metadata.fromCache){S.loaded[key]=true;if(Object.keys(S.loaded).length===4){S.dbState='ok';clearTimeout(timer)}}

}

function notifs(){const m=meEng();const seen=LS.get('seen',0);const items=[];
  S.tix.forEach(t=>{if(!isOpen(t))return;
    if(m&&t.engId===m.id&&(t.assignedAt||0)>seen)items.push({t,txt:'أُسند إليك'});
    else if(!t.engId&&(t.createdAt||0)>seen)items.push({t,txt:'بلاغ جديد بانتظار الإسناد'});
    else if(m&&t.engId===m.id&&isOver(t))items.push({t,txt:'تجاوز وقت الاستجابة',keep:1});
  });
  items.sort((a,b)=>(b.t.updatedAt||0)-(a.t.updatedAt||0));return{items,unread:items.filter(i=>!i.keep).length}}

function newNo(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `SR-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${Math.floor(100+Math.random()*900)}`}
const sysNote=text=>({at:now(),text,sys:1,by:(meEng()||{}).id||null});
async function saveTicket(f){
  const v=id=>f.querySelector('#'+id).value;

  const t0=now(),pri=v('nt_pri'),eng=v('nt_eng'),cl=v('nt_cl');
  const t={no:newNo(),custId:v('nt_cust'),title:v('nt_title').trim(),desc:v('nt_desc').trim(),prod:v('nt_prod'),type:v('nt_type'),pri,channel:v('nt_chan'),mode:v('nt_mode'),
    engId:eng||null,status:eng?'assigned':'new',createdAt:t0,updatedAt:t0,assignedAt:eng?t0:null,dueAt:t0+PRIH[pri]*HOUR,visitAt:fromInput(v('nt_visit')),
    cl:cl?{k:cl,done:[]}:null,notes:[sysNote('فُتح البلاغ'+(eng?' وأُسند إلى '+(engById(eng)||{}).name:''))]};

async function exportCsv(){
  const {from,to}=repRange();const rows=S.tix.filter(t=>t.createdAt>=from&&t.createdAt<to);
  const head=['رقم البلاغ','العنوان','العميل','المنتج','النوع','الأولوية','الحالة','القناة','المهندس','تاريخ الفتح','موعد الاستجابة','تاريخ الإغلاق','ضمن الوقت','دقائق العمل','التقييم','الحل'];
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';const iso=t=>t?new Date(t).toISOString().slice(0,16).replace('T',' '):'';
  const lines=[head.map(q).join(',')].concat(rows.map(t=>[t.no,t.title,(custById(t.custId)||{}).name,PROD[t.prod]?PROD[t.prod].n:'',TYPE[t.type],PRIN[t.pri],STN[t.status],t.channel,(engById(t.engId)||{}).name,iso(t.createdAt),iso(t.dueAt),iso(t.closedAt),t.closedAt?(t.closedAt<=t.dueAt?'نعم':'لا'):'',t.mins,t.rating,t.resolution].map(q).join(',')));
  const data='﻿'+lines.join('\r\n');
  if(!dl){toast('التصدير غير متاح في هذا العرض');return}
  try{await dl.save({filename:'بلاغات-الصيانة.csv',data});}catch(e){if(e&&e.code!=='declined')toast('تعذّر التصدير')}
}

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act],[data-open],[data-f],[data-st],[data-cf],[data-rr],[data-licdel],[data-kc],[data-tf],[data-approve],[data-reject]');if(!el)return;
  if(el.dataset.open){ev.preventDefault();openDrawer(el.dataset.open);return}
  if(el.dataset.f!=null){S.f.status=el.dataset.v;render();return}
  if(el.dataset.cf!=null){S.cs.filter=el.dataset.cf;render();return}
  if(el.dataset.rr){S.rep.range=el.dataset.rr;render();return}
  if(el.dataset.kc!=null){S.kbc=el.dataset.kc;render();return}
  if(el.dataset.tf!=null){S.tf=el.dataset.tf;render();return}
  if(el.dataset.approve){approveJoin(el.dataset.approve);return}
  if(el.dataset.reject){patch('joinreq',el.dataset.reject,{status:'rejected',decidedAt:now()}).then(ok=>ok&&toast('رُفض الطلب'));return}
  if(el.dataset.licdel!=null){const f=$('#cuForm');S.licDraft.rows=readLic(f);S.licDraft.rows.splice(+el.dataset.licdel,1);$('#licBox').innerHTML=S.licDraft.rows.map(licRow).join('');return}
  const t=S.drawer&&S.drawer.startsWith('ticket:')?tixById(S.drawer.slice(7)):null;
  if(el.dataset.st&&t){const st=el.dataset.st;const data={status:st};if(st==='progress'&&t.status==='done'){data.closedAt=null}
    await tUpdate(t,data,'تغيّرت الحالة إلى: '+STN[st]);return}
  switch(el.dataset.act){
    case 'close':closeDrawer();break;
    case 'newTicket':if(!S.canWrite){toast('وضع القراءة فقط');break}openDrawer('newTicket');break;
    case 'newTicketFor':openDrawer('newTicket:'+el.dataset.id);break;
    case 'newCustomer':S.afterCust=!!(S.drawer&&S.drawer.startsWith('newTicket'));S.licDraft=null;openDrawer('editCustomer:new');break;
    case 'newEng':openDrawer('eng:new');break;
    case 'newKb':openDrawer('editKb:new');break;
    case 'fOver':S.f.status='over';break;
    case 'fUnas':S.f.status='unas';break;
    case 'addLic':{const f=$('#cuForm');S.licDraft.rows=readLic(f);S.licDraft.rows.push({prod:'shamel',item:'term',qty:1});$('#licBox').innerHTML=S.licDraft.rows.map(licRow).join('');break}
    case 'showClose':S.closeOpen=true;$('#closeBox').hidden=false;$('#tc_res').focus();break;
    case 'hideClose':S.closeOpen=false;$('#closeBox').hidden=true;break;
    case 'doClose':if(!t)break;{const res=$('#tc_res').value.trim();if(!res){toast('اكتب الحل قبل الإغلاق');$('#tc_res').focus();break}
      await tUpdate(t,{status:'done',closedAt:now(),resolution:res,mins:+$('#tc_mins').value||0,rating:+$('#tc_rate').value||null},'أُغلق البلاغ');S.closeOpen=false;toast('أُغلق البلاغ');}break;
    case 'saveAssign':if(!t)break;{const eng=$('#ta_eng').value||null,pri=$('#ta_pri').value,mode=$('#ta_mode').value,visit=fromInput($('#ta_visit').value);const data={engId:eng,pri,mode,visitAt:visit};const notes=[];
      if(eng!==(t.engId||null)){data.assignedAt=now();if(eng&&t.status==='new')data.status='assigned';if(!eng&&t.status==='assigned')data.status='new';notes.push(eng?'أُسند إلى '+(engById(eng)||{}).name:'أُلغي الإسناد')}
      if(pri!==t.pri){data.dueAt=(t.createdAt||now())+PRIH[pri]*HOUR;notes.push('الأولوية: '+PRIN[pri])}
      if((visit||null)!==(t.visitAt||null))notes.push(visit?'موعد '+MODEN[mode]+': '+fdt(visit):'أُلغي الموعد');
      await tUpdate(t,data,notes.join(' · ')||null);toast('حُفظ');}break;
    case 'setCl':if(!t)break;{const k=$('#ta_cl').value;await tUpdate(t,{cl:k?{k,done:[]}:null},k?'أُرفقت قائمة: '+CLK[k].n:'أُزيلت قائمة الفحص');}break;
    case 'addNote':if(!t)break;{const ta=$('#ta_note');const txt=ta.value.trim();if(!txt)break;ta.value='';const n={at:now(),text:txt,by:(meEng()||{}).id||null};
      const data={notes:(t.notes||[]).concat([n]),updatedAt:now()};if(t.status==='assigned'||t.status==='new')data.status='progress';await patch('tickets',t.id,data);}break;
    case 'askDelT':$('#delT').hidden=false;break;
    case 'delT':if(t&&await remove('tickets',t.id)){closeDrawer();toast('حُذف البلاغ')}break;
    case 'askDelC':$('#delC').hidden=false;break;
    case 'delC':{const id=$('#cuForm').dataset.id;if(await remove('customers',id)){closeDrawer();toast('حُذف العميل')}}break;
    case 'delRes':{const f=$('#resForm');if(!el.dataset.sure){el.dataset.sure='1';el.textContent='تأكيد الحذف';break}if(await remove(f.dataset.col,f.dataset.id)){closeDrawer();toast('حُذف')}}break;
    case 'delKb':{const id=$('#kbForm').dataset.id;if(await remove('kb',id)){closeDrawer();toast('حُذف')}}break;
    case 'toKb':if(t){S.kbPre={title:t.title,cat:{pos:'pos',einv:'einv',link:'net',backup:'backup',install:'install',update:'install'}[t.type]||'other',prod:t.prod,problem:t.desc||t.title,solution:t.resolution,tags:TYPE[t.type]||''};openDrawer('editKb:new')}break;
    case 'csv':exportCsv();break;
    case 'clearDemo':{if(!el.dataset.sure){el.dataset.sure='1';el.textContent='تأكيد حذف كل البيانات التجريبية';break}
      const all=[['tickets',S.tix],['customers',S.cust],['engineers',S.eng],['kb',S.kb]];for(const [col,arr] of all)for(const x of arr.filter(x=>x.demo))await remove(col,x.id);toast('حُذفت البيانات التجريبية');}break;
  }
});

$('#bell').addEventListener('click',()=>openDrawer('notif'));
window.addEventListener('hashchange',()=>{closeDrawer();render();window.scrollTo(0,0)});
setInterval(()=>{if(!document.hidden&&!document.activeElement.matches('input,textarea,select'))render()},60000);
/* ===== website adapter: overrides the artifact data layer with API.eng (Supabase today, Python later) ===== */
const COLKEY={engineers:['eng'],customers:['cust'],tickets:['tix'],kb:['kb'],trials:['trials'],releases:['res','releases'],drivers:['res','drivers'],tools:['res','tools']};
function arrOf(col){const k=COLKEY[col];if(!k)return null;return k.length===1?S[k[0]]:S[k[0]][k[1]]}
function setArr(col,a){const k=COLKEY[col];if(k.length===1)S[k[0]]=a;else S[k[0]][k[1]]=a}
function setLocal(col,obj,delId){const a=arrOf(col);if(!a)return;let n=a.filter(x=>x.id!==(delId||obj.id));if(!delId)n=n.concat([obj]);setArr(col,n)}
function handleErr(e){toast((e&&e.message)||'تعذّر الحفظ، حاول مرة أخرى.')}
async function write(col,id,data){try{const r=await API.eng.put(col,id,data);setLocal(col,r);schedule();return true}catch(e){handleErr(e);return false}}
async function patch(col,id,data){
  if(col==='joinreq'){try{if(data.status==='rejected')await API.eng.join.reject(id);await loadJoins();return true}catch(e){handleErr(e);return false}}
  try{const r=await API.eng.patch(col,id,data);setLocal(col,r);schedule();return true}catch(e){handleErr(e);return false}}
async function remove(col,id){try{await API.eng.del(col,id);setLocal(col,null,id);schedule();return true}catch(e){handleErr(e);return false}}
async function loadAll(){
  const cols=Object.keys(COLKEY);
  const res=await Promise.allSettled(cols.map(c=>API.eng.list(c)));
  res.forEach((r,i)=>{if(r.status==='fulfilled'){setArr(cols[i],r.value);S.loaded[COLKEY[cols[i]][0]==='res'?cols[i]:COLKEY[cols[i]][0]]=true}});
  if(S.isAdmin){await loadJoins();try{S.profiles=Object.fromEntries((await API.users.list()).map(p=>[p.id,p]))}catch(e){}}
  S.dbState=res.every(r=>r.status==='fulfilled')?'ok':'err';schedule();
}
async function loadJoins(){try{S.joins=await API.eng.join.all()}catch(e){}schedule()}
async function refreshAccess(){
  try{S.acc=await API.eng.access()}catch(e){S.acc={state:'error',msg:e.message}}
  S.myId=S.acc.uid||null;S.isAdmin=S.acc.state==='admin';S.canWrite=true;S.assets=S.isAdmin?{}:null;S.joinLoaded=true;
  if(S.acc.engineer)S.eng=[S.acc.engineer];
  render();
  if(S.acc.state==='admin'||S.acc.state==='eng')await loadAll();
}
async function boot(){
  S.dbState='loading';render();
  if(!window.API||!API.ready||!API.eng){S.acc={state:'error',msg:'تعذّر الاتصال بالخادم.'};render();return}
  await refreshAccess();
  API.auth.onChange(()=>{refreshAccess()});
  setInterval(()=>{if(!document.hidden&&(S.acc&&(S.acc.state==='admin'||S.acc.state==='eng'))&&!S.drawer)loadAll()},45000);
}
function access(){const a=S.acc;if(!a)return'loading';if(a.state==='admin')return'admin';if(a.state==='eng')return'eng';return a.state}
function vGate(acc){
  const box=inner=>`<section class="panel" style="max-width:560px;margin:20px auto;width:100%"><div class="body" style="display:flex;flex-direction:column;gap:14px;padding:24px">${inner}</div></section>`;
  const head=`<h2 style="font-size:20px">بوابة مهندسي الصيانة والدعم</h2><p class="muted" style="margin:0">منصة داخلية لمهندسي شركة أمان الحديثة لتقنية نظم المعلومات. الدخول بحسابك، ولا تُفتح المنصة إلا بعد اعتماد الإدارة لك كمهندس.</p>`;
  const out=S.acc&&S.acc.uid?`<div><button class="btn sm ghost" data-act="signout">تسجيل الخروج${S.acc.me&&S.acc.me.email?' ('+esc(S.acc.me.email)+')':''}</button></div>`:'';
  if(acc==='loading')return box(head+'<p>جارٍ التحقق من حسابك…</p>');
  if(acc==='error')return box(head+`<div class="banner">${esc(S.acc.msg||'تعذّر الاتصال بالخادم.')}</div>`);
  if(acc==='signedout'){const up=S.signup;return box(head+`
    <div class="seg"><button data-act="modeIn" class="${up?'':'on'}">تسجيل الدخول</button><button data-act="modeUp" class="${up?'on':''}">حساب جديد</button></div>
    <form class="form" id="${up?'signupForm':'loginForm'}">
      ${up?`<div class="fld full"><label for="au_name">الاسم الكامل</label><input id="au_name" required autocomplete="name"></div><div class="fld full"><label for="au_phone">الجوال</label><input id="au_phone" inputmode="tel" autocomplete="tel"></div>`:''}
      <div class="fld full"><label for="au_email">البريد الإلكتروني</label><input id="au_email" type="email" dir="ltr" required autocomplete="email"></div>
      <div class="fld full"><label for="au_pass">كلمة المرور</label><input id="au_pass" type="password" dir="ltr" required minlength="8" autocomplete="${up?'new-password':'current-password'}"></div>
      <div class="acts full"><button class="btn pri" type="submit">${up?'إنشاء الحساب':'دخول'}</button>${up?'':'<button class="btn ghost" type="button" data-act="forgot">نسيت كلمة المرور</button>'}</div>
    </form>${up?'<p class="note">بعد إنشاء الحساب وتأكيد البريد، ادخل وأرسل طلب الانضمام كمهندس.</p>':''}`)}
  if(acc==='suspended')return box(head+'<div class="banner">حسابك موقوف حالياً أو لم يكتمل اعتماده. تواصل مع إدارة الدعم الفني.</div>'+out);
  const j=S.acc.join;
  if(acc==='pending')return box(head+`<div class="banner info" style="display:block"><b>طلبك قيد المراجعة.</b> أُرسل في ${fdt(j&&j.at)} باسم ${esc(j&&j.name)}. ستُفتح المنصة بعد موافقة الإدارة؛ أعد فتح الصفحة لاحقاً.</div>`+out);
  return box(head+`${acc==='rejected'?`<div class="banner">لم تتم الموافقة على طلبك السابق${j&&j.reason?': '+esc(j.reason):''}. يمكنك تصحيح البيانات وإرسال طلب جديد.</div>`:''}
   <b>طلب الانضمام كمهندس</b>
   <form class="form" id="joinForm">
    <div class="fld"><label for="jn_name">الاسم الكامل</label><input id="jn_name" required value="${esc(j?j.name:(S.acc.me&&S.acc.me.name)||'')}"></div>
    <div class="fld"><label for="jn_emp">الرقم الوظيفي</label><input id="jn_emp" required value="${esc(j?j.empNo:'')}"></div>
    <div class="fld"><label for="jn_phone">الجوال</label><input id="jn_phone" required inputmode="tel" value="${esc(j?j.phone:(S.acc.me&&S.acc.me.phone)||'')}"></div>
    <div class="fld"><label for="jn_region">المدينة / المنطقة</label><input id="jn_region" value="${esc(j?j.region:(S.acc.me&&S.acc.me.city)||'')}"></div>
    <div class="full"><b class="small muted">المنتجات التي تعمل عليها</b><div class="acts" style="margin-top:6px">${PRODUCTS.map(p=>`<label class="chip" style="cursor:pointer;padding:4px 10px"><input type="checkbox" id="jk_${p.k}" ${j&&(j.skills||[]).includes(p.k)?'checked':''}> ${p.n}</label>`).join('')}</div></div>
    <div class="acts full"><button class="btn pri" type="submit">إرسال الطلب للإدارة</button></div>
   </form><p class="note">تراجع الإدارة الاسم والرقم الوظيفي وبريد الحساب قبل الموافقة.</p>`+out);
}
async function saveJoin(f){const v=id=>f.querySelector('#'+id).value.trim();
  try{await API.eng.join.submit({name:v('jn_name'),empNo:v('jn_emp'),phone:v('jn_phone'),region:v('jn_region'),skills:PRODUCTS.filter(p=>f.querySelector('#jk_'+p.k).checked).map(p=>p.k)});toast('أُرسل الطلب');refreshAccess()}catch(e){handleErr(e)}}
async function approveJoin(id){const j=S.joins.find(x=>x.id===id);if(!j)return;const link=($('#jl_'+CSS.escape(id))||{}).value||null;
  try{await API.eng.join.approve(id,link);toast('اعتُمد '+j.name);await loadAll()}catch(e){handleErr(e)}}
function fillNames(){document.querySelectorAll('[data-uid]').forEach(el=>{const p=(S.profiles||{})[el.dataset.uid];el.textContent=p?(p.email||p.name||'—'):'—'})}
function resLinks(x){const a=[];const l=safeUrl(x.link);if(l)a.push(`<a class="btn sm" href="${esc(l)}" target="_blank" rel="noopener">فتح الرابط</a>`);if(x.fileId)a.push(`<button class="btn sm pri" data-file="${esc(x.fileId)}">تحميل ${esc(x.fileName||'الملف')}</button>`);return a.join(' ')||'<span class="small muted">لا يوجد ملف بعد</span>'}
async function saveRes(f){const col=f.dataset.col,cfg=RES[col];const id=f.dataset.id||rid();const old=S.res[col].find(r=>r.id===id)||{};
  const d={};for(const [k,,t] of cfg.fields){const v=f.querySelector('#rf_'+k).value.trim();d[k]=t==='date'?fromInput(v):v}
  if(d.link&&!safeUrl(d.link)){toast('الرابط يجب أن يبدأ بـ https://');return}
  d.fileId=old.fileId||null;
  const file=f.querySelector('#rf_file')&&f.querySelector('#rf_file').files[0];
  if(file){toast('جارٍ رفع الملف…');try{d.fileId=await API.eng.files.upload(file)}catch(e){toast('تعذّر رفع الملف. الحد الأقصى في الخطة المجانية 50 ميجابايت للملف.');return}}
  d.updatedAt=now();if(await write(col,id,d)){toast('حُفظ');openDrawer('resv:'+col+'|'+id)}}
async function exportCsv(){
  const {from,to}=repRange();const rows=S.tix.filter(t=>t.createdAt>=from&&t.createdAt<to);
  const head=['رقم البلاغ','العنوان','العميل','المنتج','النوع','الأولوية','الحالة','القناة','المهندس','تاريخ الفتح','موعد الاستجابة','تاريخ الإغلاق','ضمن الوقت','دقائق العمل','التقييم','الحل'];
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';const iso=t=>t?new Date(t).toISOString().slice(0,16).replace('T',' '):'';
  const lines=[head.map(q).join(',')].concat(rows.map(t=>[t.no,t.title,(custById(t.custId)||{}).name,PROD[t.prod]?PROD[t.prod].n:'',TYPE[t.type],PRIN[t.pri],STN[t.status],t.channel,(engById(t.engId)||{}).name,iso(t.createdAt),iso(t.dueAt),iso(t.closedAt),t.closedAt?(t.closedAt<=t.dueAt?'نعم':'لا'):'',t.mins,t.rating,t.resolution].map(q).join(',')));
  const url=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='بلاغات-الصيانة.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-act="signout"],[data-act="modeIn"],[data-act="modeUp"],[data-act="forgot"],[data-file]');if(!el)return;
  if(el.dataset.file){ev.stopPropagation();const w=window.open('','_blank');try{const u=await API.eng.files.url(el.dataset.file);if(w)w.location=u;else location.href=u}catch(e){if(w)w.close();toast('تعذّر فتح الملف')}return}
  const a=el.dataset.act;
  if(a==='signout'){await API.auth.signOut();S.acc=null;location.hash='';refreshAccess()}
  else if(a==='modeIn'){S.signup=false;render()}else if(a==='modeUp'){S.signup=true;render()}
  else if(a==='forgot'){const e=($('#au_email')||{}).value;if(!e){toast('اكتب بريدك أولاً');return}try{await API.auth.resetPassword(e.trim());toast('أرسلنا رابط إعادة التعيين إلى بريدك')}catch(err){handleErr(err)}}
},true);
document.addEventListener('submit',async ev=>{const f=ev.target;if(f.id!=='loginForm'&&f.id!=='signupForm')return;ev.preventDefault();ev.stopImmediatePropagation();
  const v=id=>f.querySelector('#'+id).value.trim();
  try{if(f.id==='loginForm'){await API.auth.signIn({email:v('au_email'),password:f.querySelector('#au_pass').value});await refreshAccess()}
  else{await API.auth.signUp({email:v('au_email'),password:f.querySelector('#au_pass').value,name:v('au_name'),phone:v('au_phone')});toast('أنشئ الحساب. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.');S.signup=false;render()}}catch(e){handleErr(e)}},true);

boot();
})();
</script>
